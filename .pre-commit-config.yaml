# Install: pip install pre-commit && pre-commit install
# Run all: pre-commit run --all-files

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-added-large-files
        args: ['--maxkb=1000']
      - id: detect-private-key
      - id: check-merge-conflict

  - repo: https://github.com/trufflesecurity/trufflehog
    rev: v3.88.30
    hooks:
      - id: trufflehog
        args: ['--only-verified']

  - repo: local
    hooks:
      - id: github-actions-pins
        name: GitHub Actions SHA pins
        entry: scripts/validate-github-actions-pins.sh
        language: system
        pass_filenames: false
        files: '^\.github/workflows/.*\.ya?ml$|^\.github/actions/(.*/)?action\.ya?ml$|^scripts/validate-github-actions-pins\.sh$'

      - id: github-actions-pin-tests
        name: GitHub Actions SHA pin tests
        entry: scripts/test-validate-github-actions-pins.sh
        language: system
        pass_filenames: false
        files: '^scripts/(validate|test-validate)-github-actions-pins\.sh$'

      - id: install-script-tests
        name: install.sh tests
        entry: scripts/test-install.sh
        language: system
        pass_filenames: false
        files: '^scripts/(install|test-install)\.sh$'

      - id: release-please-sync
        name: release-please config/manifest sync
        entry: scripts/check-release-please-sync.sh
        language: system
        pass_filenames: false
        files: '^(release-please-config\.json|\.release-please-manifest\.json|scripts/check-release-please-sync\.sh)$'

      - id: i18n-parity
        name: Chrome/Edge i18n parity
        entry: scripts/check-i18n-parity.sh
        language: system
        pass_filenames: false
        files: '^apps/(chrome|edge)-extension/(_locales/en/messages\.json|manifest\.json|popup/popup\.html)$|^scripts/check-i18n-parity\.sh$'

      - id: i18n-parity-tests
        name: Chrome/Edge i18n parity tests
        entry: scripts/test-check-i18n-parity.sh
        language: system
        pass_filenames: false
        files: '^scripts/(check-i18n-parity|test-check-i18n-parity)\.sh$'

      - id: main-ci-notification-payload
        name: main CI notification payload builds
        entry: scripts/check-main-ci-notification-payload.sh
        language: system
        pass_filenames: false
        # The check now reads every workflow's `on:` block, not just the
        # notifier's, so adding an app workflow has to run it locally too --
        # that addition is the exact case it exists to catch.
        files: '^(\.github/workflows/.*\.ya?ml|scripts/check-main-ci-notification-payload\.sh)$'

      - id: validated-base-resolver
        name: validated-base resolver tests
        entry: scripts/test-resolve-validated-base.sh
        language: system
        pass_filenames: false
        files: '^scripts/(resolve|test-resolve)-validated-base\.sh$'

      - id: cli-release-verifier
        name: CLI release verifier tests
        entry: scripts/test-verify-cli-release.sh
        language: system
        pass_filenames: false
        files: '^scripts/(verify-cli-release|test-verify-cli-release)\.sh$'

      - id: release-please-sync-check
        name: release-please sync check tests
        entry: scripts/test-check-release-please-sync.sh
        language: system
        pass_filenames: false
        files: '^scripts/(check-release-please-sync|test-check-release-please-sync)\.sh$'

      - id: go-fmt
        name: go fmt
        entry: gofmt -w
        language: system
        types: [go]

      - id: go-mod-tidy
        name: go mod tidy
        entry: go mod tidy
        language: system
        pass_filenames: false
        files: '(\.go|go\.mod|go\.sum)$'

  - repo: https://github.com/golangci/golangci-lint
    rev: v2.12.2
    hooks:
      - id: golangci-lint
        args: ['--timeout=5m']
