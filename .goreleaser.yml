version: 2

project_name: qurl

before:
  hooks:
    - go mod tidy
    # Generate man pages and shell completions for inclusion in archives.
    # The cask below installs both from the archive by exact path — the old
    # formula generated completions at install time, which casks cannot do.
    - go build -o /tmp/qurl-gendocs ./apps/cli/cmd/
    - /tmp/qurl-gendocs docs man -d manpages
    - ./scripts/cli-completions.sh

builds:
  - id: qurl
    main: ./apps/cli/cmd/
    binary: qurl
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X main.version={{.Version}}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - id: qurl
    ids:
      - qurl
    name_template: "qurl_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - manpages/*
      - completions/*
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: "checksums.txt"

# Per-archive SPDX SBOMs (syft). qurl-connector ships an SPDX SBOM with its
# customer image (docker-publish.yml, buildx `sbom: true`); this is the same
# supply-chain surface for the CLI's archives — one `<archive>.sbom.json` per
# tar.gz/zip, uploaded as a release asset and listed in checksums.txt, so the
# checksum signature below transitively covers every SBOM document.
sboms:
  - artifacts: archive

# Keyless Sigstore signature over the checksum manifest — qurl-connector's
# proven cosign model (docker-publish.yml signs the image digest once, not
# per-tag) adapted from image digests to blobs: sign ONCE over checksums.txt,
# which enumerates the SHA-256 of every archive, deb/rpm, and SBOM, instead
# of per-artifact signatures. cosign exchanges the release-cli job's OIDC
# token (id-token: write in .github/workflows/release-please.yml) for a
# short-lived Fulcio certificate whose SAN names this repo + workflow + ref,
# and appends the signing event to the public Rekor transparency log; no key
# material exists on our side. `--yes` skips the interactive Rekor-upload
# confirmation (mandatory in CI). Consumers verify with the recipe in
# RELEASING.md, and release-cli re-runs that exact recipe as a post-release
# self-test. Snapshot builds (`make release-snapshot`, cli-nightly.yml) pass
# `--skip=sign`: keyless signing needs GitHub's OIDC broker, which exists
# only on Actions runs holding the id-token permission.
#
# Bundle format, NOT the older `--output-signature`/`--output-certificate`
# pair: cosign v3 (the pinned signer is v3.0.6) emits the Sigstore bundle by
# default and deprecates-and-IGNORES the classic output flags — a config
# using them signs but writes no signature file at all, and v3.1+ hard-errors
# ("must specify --bundle with --new-bundle-format"). The single
# checksums.txt.sigstore.json embeds signature, Fulcio certificate, and the
# Rekor inclusion proof, so verification works offline.
signs:
  - cmd: cosign
    signature: "${artifact}.sigstore.json"
    args:
      - sign-blob
      - "--bundle=${signature}"
      - "${artifact}"
      - "--yes"
    artifacts: checksum
    output: true

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
      - "^chore:"

# Successor to the deprecated `brews` formula pipe. The cask installs what the
# formula would have — binary on PATH, completions, man pages, via the same
# `brew install layervai/tap/qurl` (unqualified names resolve to the cask
# because the tap has no formula of this name) — with three differences:
#  - manpages/completions are exact shipped paths: casks can neither glob the
#    way the formula's Dir["manpages/*.1"] did nor run the binary at install
#    time. apps/cli/cmd/goreleaser_contract_test.go pins both lists to the
#    real command tree so drift fails CI instead of breaking `brew install`
#    at the next release.
#  - Homebrew quarantines cask downloads (it never quarantined formula
#    installs) and these binaries are unsigned, so without the post-install
#    hook Gatekeeper blocks the first run on macOS.
#  - Casks have no `test do` block; the nightly snapshot job covers build
#    sanity instead.
homebrew_casks:
  - name: qurl
    repository:
      owner: layervai
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    directory: Casks
    homepage: "https://layerv.ai"
    description: "qURL CLI - manage secure links from the command line"
    license: "MIT"
    url:
      verified: github.com/layervai/qurl-integrations/releases/download
    manpages:
      - manpages/qurl-completion.1
      - manpages/qurl-connector-run.1
      - manpages/qurl-connector.1
      - manpages/qurl-delete.1
      - manpages/qurl-get.1
      - manpages/qurl-list.1
      - manpages/qurl-login.1
      - manpages/qurl-logout.1
      - manpages/qurl-publish.1
      - manpages/qurl-resolve.1
      - manpages/qurl-version.1
      - manpages/qurl-whoami.1
      - manpages/qurl.1
    completions:
      bash: completions/qurl.bash
      zsh: completions/qurl.zsh
      fish: completions/qurl.fish
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/qurl"]
          end

nfpms:
  - id: qurl
    ids:
      - qurl
    vendor: LayerV
    homepage: "https://layerv.ai"
    maintainer: "LayerV <support@layerv.ai>"
    description: "qURL CLI - manage secure links from the command line"
    license: "MIT"
    formats:
      - deb
      - rpm
    contents:
      - src: manpages/qurl.1
        dst: /usr/share/man/man1/qurl.1

release:
  # release-please creates the GitHub Release (tag + changelog notes) before
  # GoReleaser runs (see .github/workflows/release-please.yml); GoReleaser
  # must attach artifacts to it without replacing those notes. keep-existing
  # is the current default — pinned because the handshake breaks if the
  # default ever changes.
  mode: keep-existing
  # Make re-runs idempotent: without this, re-running the release-cli job
  # after a partial upload 422s on the assets that did make it.
  replace_existing_artifacts: true
