name: Release Please

# Release flow for the monorepo:
#
#   1. release-please maintains per-component release PRs (see
#      release-please-config.json). Merging one creates the tag and the
#      GitHub Release.
#   2. CLI releases additionally run GoReleaser to attach binaries, publish
#      the Homebrew tap formula, and build deb/rpm packages.
#
# GoReleaser runs as a dependent job here — NOT as a tag-triggered workflow —
# because release-please tags with the workflow's GITHUB_TOKEN, and GitHub
# never fires `on: push: tags:` workflows for events created by that token.
#
# The CLI is the one component released WITHOUT a component prefix in its tag
# (`v0.2.0`, not `cli-v0.2.0`; `include-component-in-tag: false` in
# release-please-config.json). OSS GoReleaser derives {{ .Version }} from the
# current semver tag and cannot parse prefixed tags (monorepo tag_prefix is a
# GoReleaser Pro feature). scripts/install.sh and Formula/qurl.rb rely on
# this contract, and GORELEASER_CURRENT_TAG pins it below — a combined
# release PR can put several components' tags on one commit, and GoReleaser
# must not guess which one is the CLI's.
#
# Failure/recovery semantics: if release-cli fails, the tag and the GitHub
# Release already exist without binaries (the installer 404s on that version
# until assets land; a normal minutes-long window like this also exists on
# every release while GoReleaser uploads). Recover with "Re-run failed jobs"
# on the failed run, or run this workflow via workflow_dispatch with cli_tag
# set to the affected tag. Do NOT "Re-run all jobs": release-please then
# sees the release already exists and skips release-cli. Asset re-uploads
# are idempotent (release.replace_existing_artifacts in .goreleaser.yml).

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      cli_tag:
        description: "Existing bare CLI release tag (e.g. v0.2.0) to build and attach assets for"
        required: true
        type: string

# Serialize runs: canceling a release mid-publish is exactly the
# half-published state the recovery notes above exist for.
concurrency:
  group: release-please
  cancel-in-progress: false

permissions: {}

jobs:
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    outputs:
      cli_release_created: ${{ steps.release.outputs['apps/cli--release_created'] }}
      cli_tag: ${{ steps.release.outputs['apps/cli--tag_name'] }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  release-cli:
    needs: release-please
    if: >-
      !cancelled() && (
        needs.release-please.outputs.cli_release_created == 'true' ||
        github.event_name == 'workflow_dispatch'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      # Required for cosign keyless signing (`signs:` in .goreleaser.yml) —
      # cosign requests an OIDC token from GitHub
      # (`ACTIONS_ID_TOKEN_REQUEST_TOKEN` / `_URL`, auto-discovered) and
      # presents it to Fulcio to mint the short-lived signing certificate.
      # Job-scoped rather than workflow-level, mirroring qurl-connector's
      # docker-publish.yml: the release-please job above must not be able to
      # mint certificates carrying this repo's release identity.
      id-token: write
    env:
      CLI_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.cli_tag || needs.release-please.outputs.cli_tag }}
    steps:
      # `required: true` validates presence, not non-emptiness; an empty
      # cli_tag would check out the default branch and put GoReleaser back
      # on tag auto-detection.
      - name: Require a non-empty tag
        run: '[ -n "$CLI_TAG" ] || { echo "cli_tag is empty" >&2; exit 1; }'

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.CLI_TAG }}
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # cosign for the keyless `signs:` step in .goreleaser.yml and the
      # self-test below. Pin copied from qurl-connector's docker-publish.yml:
      # sigstore/cosign-installer v4.1.2
      # (6f9f17788090df1f26f669e9d70d6ae9567deba6, 2026-05-07).
      # `cosign-release` pins the cosign binary the installer fetches —
      # without it, an upstream installer default-bump would silently change
      # the binary that signs releases. Update it in lockstep with the action
      # SHA, and keep RELEASING.md's "cosign v3.0+" consumer floor a subset
      # of the version signed with here.
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: 'v3.0.6'

      # syft for the `sboms:` step in .goreleaser.yml (GoReleaser shells out
      # to `syft` on PATH). Same explicit-tool-pin rationale as cosign above:
      # sbom-action v0.24.0's bundled default is syft v1.42.3 — pinning it as
      # an input keeps a future action bump from silently changing the SBOM
      # generator, and surfaces the tool bump as a one-line reviewable diff.
      # Keep in lockstep with cli-nightly.yml's copy (the snapshot exercises
      # the same SBOM path).
      - name: Install syft
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          syft-version: 'v1.42.3'

      # release.mode keep-existing (pinned in .goreleaser.yml): GoReleaser
      # uploads artifacts to the release release-please just created and
      # keeps its notes.
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
          # Pin which tag is being released. A combined release PR can tag
          # this commit for several components at once, and GoReleaser's
          # auto-detection would otherwise pick one by version-sort luck.
          GORELEASER_CURRENT_TAG: ${{ env.CLI_TAG }}

      # Self-test the signature with the EXACT consumer recipe from
      # RELEASING.md — qurl-connector's docker-publish.yml runs the same
      # post-sign verify against its documented recipe. If the documented
      # identity/issuer and what Fulcio actually minted ever drift — a
      # workflow rename, a recovery dispatch from a non-main ref, an OIDC
      # claim change — the release fails loudly here instead of shipping
      # artifacts whose published verification recipe is wrong.
      #
      # The identity is exact, not a regexp: unlike the connector's
      # tag-triggered publish (whose SAN embeds the per-release tag ref and
      # so needs `--certificate-identity-regexp`), this job always runs from
      # refs/heads/main — release-please only triggers on main pushes, and
      # recovery dispatches must be run from main. Rename cost: renaming this
      # workflow file changes the identity; update this step and RELEASING.md
      # in lockstep.
      - name: Verify release signature (self-test)
        run: |
          cosign verify-blob \
            --bundle dist/checksums.txt.sigstore.json \
            --certificate-identity 'https://github.com/layervai/qurl-integrations/.github/workflows/release-please.yml@refs/heads/main' \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            dist/checksums.txt

      - name: Post recovery instructions on failure
        if: failure()
        run: |
          {
            echo "## CLI release incomplete"
            echo ""
            echo "Tag and GitHub Release \`${CLI_TAG}\` exist, but GoReleaser did not finish attaching assets — \`scripts/install.sh\` 404s on this version and the Homebrew tap was not updated."
            echo ""
            echo "Recovery: fix the cause, then re-run via workflow_dispatch with \`cli_tag=${CLI_TAG}\`, or use **Re-run failed jobs** on this run. Do NOT use 'Re-run all jobs' (release-please will skip this job because the release already exists). Re-uploads are idempotent."
          } >> "$GITHUB_STEP_SUMMARY"
