name: Release Please

# Release flow for the monorepo:
#
#   1. release-please maintains per-component release PRs (see
#      release-please-config.json). Merging one creates the tag and a draft
#      GitHub Release.
#   2. CLI releases additionally run GoReleaser to attach binaries and build
#      deb/rpm packages. The workflow verifies every artifact, publishes the
#      release, and only then updates the Homebrew tap.
#
# GoReleaser runs as a dependent job here — NOT as a tag-triggered workflow —
# because release-please tags with the workflow's GITHUB_TOKEN, and GitHub
# never fires `on: push: tags:` workflows for events created by that token.
#
# The CLI is the one component released WITHOUT a component prefix in its tag
# (`v0.2.0`, not `cli-v0.2.0`; `include-component-in-tag: false` in
# release-please-config.json). OSS GoReleaser derives {{ .Version }} from the
# current semver tag and cannot parse prefixed tags (monorepo tag_prefix is a
# GoReleaser Pro feature). scripts/install.sh and Formula/qurl.rb rely on
# this contract, and GORELEASER_CURRENT_TAG pins it below — a combined
# release PR can put several components' tags on one commit, and GoReleaser
# must not guess which one is the CLI's.
#
# Failure/recovery semantics: until every verification succeeds, the tag and a
# draft GitHub Release exist but no new CLI release is public and the Homebrew
# tap stays on its prior version. Recover with "Re-run failed jobs" on the
# failed run, or run this workflow via workflow_dispatch with cli_tag set to
# the affected tag. Do NOT "Re-run all jobs": release-please then sees the
# release already exists and skips release-cli. Asset re-uploads are idempotent
# (release.replace_existing_artifacts in .goreleaser.yml).
#
# The other failure mode, and the worse one, is a release release-please
# never made. What it looks like: this workflow runs green, main carries an
# updated .release-please-manifest.json and apps/cli/CHANGELOG.md, and there
# is no tag and no GitHub Release for that version. release-cli never fires
# (apps/cli--release_created is false), so nothing goes red. Every later
# release-please run then aborts with "There are untagged, merged release PRs
# outstanding", which blocks release PRs for EVERY component until someone
# relabels the merged PR "autorelease: pending" -> "autorelease: tagged".
#
# Why: release-please matches a merged release PR to a package before
# building its release. A PR body carrying a single componentless section
# takes the "standalone release PR" path, which compares the PR's *branch*
# component against getBranchComponent() — and getBranchComponent(), unlike
# getComponent(), ignores include-component-in-tag. The manifest release PR
# always sits on `release-please--branches--main` (branch component:
# undefined) and the CLI's section is componentless because the CLI is
# bare-tagged, so a `component` declared for apps/cli loses that comparison
# and the release is skipped with a warning while the action exits 0. A CLI
# release sharing its PR with any other component takes the multi-section
# path and succeeds, so this bites only when the CLI is released alone. It
# dropped v1.1.0, v1.3.0 and v1.4.0 that way.
#
# Both halves are now pinned. apps/cli declares no component, and
# scripts/check-release-please-sync.sh fails the build if one comes back.
# scripts/verify-cli-release.sh runs below on every push and turns a dropped
# release from a green run into a red one that names the recovery.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      cli_tag:
        description: "Existing bare CLI release tag (e.g. v0.2.0) to build and attach assets for"
        required: true
        type: string

# Serialize runs: canceling a release mid-publish is exactly the
# half-published state the recovery notes above exist for.
concurrency:
  group: release-please
  cancel-in-progress: false

permissions: {}

jobs:
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    outputs:
      cli_release_created: ${{ steps.release.outputs['apps/cli--release_created'] }}
      cli_tag: ${{ steps.release.outputs['apps/cli--tag_name'] }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # Checked out after the release step, not before: release-please works
      # entirely over the API and never reads the workspace, so ordering it
      # this way keeps this change provably unable to affect the release
      # itself. Default fetch-depth is enough — the verifier reads one file at
      # this push's commit and asks the API about the release.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The header above describes what this catches. It is silent on ordinary
      # pushes: the manifest names the last released CLI version and that
      # release exists. It fails the run only when the manifest names a version
      # nothing released — the state that otherwise reports green and then
      # blocks every component's next release PR.
      #
      # Deliberately not `if: always()`. A release-please step that already
      # failed has reddened the run; this exists for the case where it
      # succeeded and released nothing.
      - name: Verify the CLI release was created
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/verify-cli-release.sh

  release-cli:
    needs: release-please
    if: >-
      !cancelled() && (
        needs.release-please.outputs.cli_release_created == 'true' ||
        github.event_name == 'workflow_dispatch'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
      packages: write
      # Required for cosign keyless signing (`signs:` in .goreleaser.yml) —
      # cosign requests an OIDC token from GitHub
      # (`ACTIONS_ID_TOKEN_REQUEST_TOKEN` / `_URL`, auto-discovered) and
      # presents it to Fulcio to mint the short-lived signing certificate.
      # Job-scoped rather than workflow-level: the release-please job above
      # must not be able to mint certificates carrying this repo's release
      # identity.
      id-token: write
    env:
      CLI_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.cli_tag || needs.release-please.outputs.cli_tag }}
    steps:
      # Recovery dispatches can be launched from any ref in the GitHub UI.
      # Reject them before checkout or GoReleaser can upload anything: the
      # documented keyless signer identity and every post-release verification
      # intentionally bind this workflow to refs/heads/main.
      - name: Require the canonical release branch
        run: |
          [ "$GITHUB_REF" = refs/heads/main ] || {
            echo "::error::CLI releases must run from refs/heads/main, got ${GITHUB_REF}" >&2
            exit 1
          }

      # `required: true` validates presence, not non-emptiness; an empty
      # cli_tag would check out the default branch and put GoReleaser back
      # on tag auto-detection.
      - name: Require a non-empty tag
        run: '[ -n "$CLI_TAG" ] || { echo "cli_tag is empty" >&2; exit 1; }'

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.CLI_TAG }}
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # cosign for the keyless `signs:` step in .goreleaser.yml and the
      # self-test below. Pin sigstore/cosign-installer v4.1.2 explicitly.
      # (6f9f17788090df1f26f669e9d70d6ae9567deba6, 2026-05-07).
      # `cosign-release` pins the cosign binary the installer fetches —
      # without it, an upstream installer default-bump would silently change
      # the binary that signs releases. Update it in lockstep with the action
      # SHA, and keep RELEASING.md's "cosign v3.0+" consumer floor a subset
      # of the version signed with here.
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: 'v3.0.6'

      - name: Install ORAS
        uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d # v2.0.1
        with:
          version: 1.3.1

      # syft for the `sboms:` step in .goreleaser.yml (GoReleaser shells out
      # to `syft` on PATH). Same explicit-tool-pin rationale as cosign above:
      # sbom-action v0.24.0's bundled default is syft v1.42.3 — pinning it as
      # an input keeps a future action bump from silently changing the SBOM
      # generator, and surfaces the tool bump as a one-line reviewable diff.
      # Keep in lockstep with cli-nightly.yml's copy (the snapshot exercises
      # the same SBOM path).
      - name: Install syft
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          syft-version: 'v1.42.3'

      - name: Verify the production NHP Hub trust pin
        env:
          QURL_REQUIRE_RELEASE_HUB_PIN: '1'
          QURL_RELEASE_HUB_PUBLIC_KEY_B64: ${{ secrets.QURL_PROD_NHP_HUB_PUBLIC_KEY_B64 }}
          QURL_RELEASE_HUB_PUBLIC_KEY_SHA256: ${{ secrets.QURL_PROD_NHP_HUB_PUBLIC_KEY_SHA256 }}
        run: |
          set -euo pipefail
          test_name=TestReleaseHubPinEnvironment
          test_pattern='^TestReleaseHubPinEnvironment$'
          actual_test="$(go test ./apps/cli/internal/connector/hub -list "$test_pattern" | sed -n '/^Test/p')"
          if [[ "$actual_test" != "$test_name" ]]; then
            echo "::error::exact production Hub-pin test declaration is missing or ambiguous"
            exit 1
          fi
          events=$(mktemp)
          trap 'rm -f "$events"' EXIT
          test_status=0
          go test ./apps/cli/internal/connector/hub -run "$test_pattern" -count=1 -json >"$events" || test_status=$?
          jq -j 'select(.Output != null) | .Output' "$events"
          passed="$(jq -r --arg test "$test_name" 'select(.Action == "pass" and .Test == $test) | .Test' "$events")"
          skipped="$(jq -r --arg test "$test_name" 'select(.Action == "skip" and .Test == $test) | .Test' "$events")"
          if [[ -n "$skipped" || "$passed" != "$test_name" ]]; then
            echo "::error::required production Hub-pin test must report one PASS and no SKIP"
            exit 1
          fi
          if (( test_status != 0 )); then
            exit "$test_status"
          fi

      # release.mode keep-existing (pinned in .goreleaser.yml): GoReleaser
      # uploads artifacts to the release release-please just created and
      # keeps its notes.
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          QURL_RELEASE_HUB_PUBLIC_KEY_B64: ${{ secrets.QURL_PROD_NHP_HUB_PUBLIC_KEY_B64 }}
          # Pin which tag is being released. A combined release PR can tag
          # this commit for several components at once, and GoReleaser's
          # auto-detection would otherwise pick one by version-sort luck.
          GORELEASER_CURRENT_TAG: ${{ env.CLI_TAG }}

      - name: Verify the draft CLI carries the exact production Hub trust pin
        env:
          GH_TOKEN: ${{ github.token }}
          QURL_RELEASE_HUB_PUBLIC_KEY_B64: ${{ secrets.QURL_PROD_NHP_HUB_PUBLIC_KEY_B64 }}
          QURL_RELEASE_HUB_PUBLIC_KEY_SHA256: ${{ secrets.QURL_PROD_NHP_HUB_PUBLIC_KEY_SHA256 }}
        run: |
          set -euo pipefail
          work=$(mktemp -d)
          trap 'rm -rf "$work"' EXIT
          gh release download "$CLI_TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern 'qurl_*_darwin_*.tar.gz' \
            --pattern 'qurl_*_linux_*.tar.gz' \
            --pattern 'qurl_*_windows_*.zip' \
            --dir "$work"
          mapfile -t archives < <(find "$work" -maxdepth 1 -type f \( -name 'qurl_*.tar.gz' -o -name 'qurl_*.zip' \) | LC_ALL=C sort)
          if (( ${#archives[@]} != 6 )); then
            echo "::error::expected all six released qurl archives, found ${#archives[@]}" >&2
            exit 1
          fi
          native_binary=
          for index in "${!archives[@]}"; do
            archive="${archives[$index]}"
            extracted="$work/extracted-$index"
            mkdir "$extracted"
            case "$archive" in
              *.zip) unzip -q "$archive" -d "$extracted"; binary="$extracted/qurl.exe" ;;
              *.tar.gz) tar -xzf "$archive" -C "$extracted"; binary="$extracted/qurl" ;;
              *) echo "::error::unexpected qurl archive: $archive" >&2; exit 1 ;;
            esac
            if [[ ! -f "$binary" ]] || ! grep -aFq -- "$QURL_RELEASE_HUB_PUBLIC_KEY_B64" "$binary"; then
              echo "::error::$(basename "$archive") does not carry the exact verified production Hub trust root" >&2
              exit 1
            fi
            if [[ "$archive" == *_linux_amd64.tar.gz ]]; then
              native_binary=$binary
            fi
          done
          if [[ -z "$native_binary" || ! -x "$native_binary" ]]; then
            echo "::error::released linux/amd64 archive has no executable qurl binary" >&2
            exit 1
          fi
          fingerprint=$("$native_binary" version --verify-release-native-trust)
          if [[ "$fingerprint" != "$QURL_RELEASE_HUB_PUBLIC_KEY_SHA256" ]]; then
            echo "::error::draft CLI does not carry the exact verified production Hub trust pin" >&2
            exit 1
          fi

      - name: Set up QEMU for qurl image smoke
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve an existing released qurl image
        id: qurl_existing
        env:
          IMAGE_TAG: ghcr.io/layervai/qurl:${{ env.CLI_TAG }}
        run: |
          error_file="$(mktemp)"
          if descriptor="$(oras manifest fetch --descriptor "$IMAGE_TAG" 2>"$error_file")"; then
            digest="$(jq -er '.digest | select(test("^sha256:[0-9a-f]{64}$"))' <<<"$descriptor")"
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "digest=$digest" >> "$GITHUB_OUTPUT"
          elif grep -Eiq 'not found|manifest unknown|manifest_unknown|404' "$error_file"; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
          else
            cat "$error_file" >&2
            exit 1
          fi

      # Publish an untagged multi-arch candidate first. The tag is promoted
      # only after both platform manifests run the exact released version.
      # BuildKit emits the image provenance and SPDX SBOM attestations.
      - name: Build qurl image candidate
        id: qurl_image
        if: steps.qurl_existing.outputs.exists != 'true'
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          file: apps/cli/Dockerfile
          platforms: linux/amd64,linux/arm64
          build-args: |
            VERSION=${{ env.CLI_TAG }}
            HUB_TRUST_ROOT_B64=${{ secrets.QURL_PROD_NHP_HUB_PUBLIC_KEY_B64 }}
          provenance: mode=max
          sbom: true
          outputs: type=image,name=ghcr.io/layervai/qurl,push-by-digest=true,name-canonical=true,push=true

      - name: Smoke both qurl image platforms
        env:
          QURL_IMAGE: ghcr.io/layervai/qurl@${{ steps.qurl_existing.outputs.digest || steps.qurl_image.outputs.digest }}
          QURL_RELEASE_HUB_PUBLIC_KEY_SHA256: ${{ secrets.QURL_PROD_NHP_HUB_PUBLIC_KEY_SHA256 }}
        run: |
          set -euo pipefail
          image_name="${QURL_IMAGE%@*}"
          index_json="$(docker buildx imagetools inspect "$QURL_IMAGE" --raw)"
          for platform in linux/amd64 linux/arm64; do
            os="${platform%/*}"
            architecture="${platform#*/}"
            platform_digest="$(jq -er \
              --arg os "$os" --arg architecture "$architecture" '
                [.manifests[] | select(
                  .platform.os == $os and
                  .platform.architecture == $architecture
                )] |
                if length == 1 then .[0].digest
                else error("expected exactly one platform manifest")
                end
              ' <<<"$index_json")"
            platform_candidate="${image_name}@${platform_digest}"
            got="$(docker run --rm --platform "$platform" "$platform_candidate" version | awk '{print $3}')"
            [ "$got" = "$CLI_TAG" ] || {
              echo "::error::${platform} image reports ${got}, want ${CLI_TAG}" >&2
              exit 1
            }
            fingerprint=$(docker run --rm --platform "$platform" "$platform_candidate" version --verify-release-native-trust)
            [ "$fingerprint" = "$QURL_RELEASE_HUB_PUBLIC_KEY_SHA256" ] || {
              echo "::error::${platform} image does not carry the exact verified production Hub trust pin" >&2
              exit 1
            }
          done

      - name: Promote and sign tested qurl image
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE_NAME: ghcr.io/layervai/qurl
          IMAGE_DIGEST: ${{ steps.qurl_existing.outputs.digest || steps.qurl_image.outputs.digest }}
          IMAGE_ALREADY_TAGGED: ${{ steps.qurl_existing.outputs.exists }}
        run: |
          candidate="${IMAGE_NAME}@${IMAGE_DIGEST}"
          tagged="${IMAGE_NAME}:${CLI_TAG}"
          if [ "$IMAGE_ALREADY_TAGGED" != 'true' ]; then
            docker buildx imagetools create --tag "$tagged" "$candidate"
          fi
          promoted_digest="$(docker buildx imagetools inspect "$tagged" | awk '$1 == "Digest:" { print $2; exit }')"
          [ "$promoted_digest" = "$IMAGE_DIGEST" ] || {
            echo "::error::promoted qurl image digest ${promoted_digest} differs from tested ${IMAGE_DIGEST}" >&2
            exit 1
          }
          # A multi-platform OCI index has one BuildKit provenance and SBOM
          # statement per platform; imagetools' single-image .Provenance/.SBOM
          # shortcuts do not aggregate them. Fetch and validate the four exact
          # in-toto blobs, then sign the manifest that binds their digests to
          # this tested index digest.
          QURL_EXPECTED_VCS_REVISION="$(git rev-parse HEAD)" \
          QURL_EXPECTED_VCS_SOURCE=https://github.com/layervai/qurl-integrations \
            scripts/extract-qurl-image-attestations.sh "$candidate" dist/qurl-image-attestations
          cp dist/qurl-image-attestations/qurl-image-buildkit-manifest.json dist/qurl-image-buildkit-manifest.json
          cosign sign --yes "$candidate"
          cosign attest --yes \
            --type https://layerv.ai/attestations/qurl-image-buildkit-manifest/v1 \
            --predicate dist/qurl-image-buildkit-manifest.json \
            "$candidate"
          cosign verify \
            --certificate-identity 'https://github.com/layervai/qurl-integrations/.github/workflows/release-please.yml@refs/heads/main' \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "$candidate" >/dev/null
          cosign verify-attestation --type https://layerv.ai/attestations/qurl-image-buildkit-manifest/v1 \
            --certificate-identity 'https://github.com/layervai/qurl-integrations/.github/workflows/release-please.yml@refs/heads/main' \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "$candidate" >/dev/null
          printf '%s\n' "$candidate" > dist/qurl-image.txt
          gh release upload "$CLI_TAG" dist/qurl-image.txt dist/qurl-image-buildkit-manifest.json --clobber

      # Self-test the signature with the exact consumer recipe from
      # RELEASING.md. If the documented
      # identity/issuer and what Fulcio actually minted ever drift — a
      # workflow rename, a recovery dispatch from a non-main ref, an OIDC
      # claim change — the release fails loudly here instead of shipping
      # artifacts whose published verification recipe is wrong.
      #
      # The identity is exact, not a regexp: this job always runs from
      # refs/heads/main. Release-please only triggers on main pushes, and
      # recovery dispatches must be run from main. Rename cost: renaming this
      # workflow file changes the identity; update this step and RELEASING.md
      # in lockstep.
      - name: Verify release signature (self-test)
        run: |
          cosign verify-blob \
            --bundle dist/checksums.txt.sigstore.json \
            --certificate-identity 'https://github.com/layervai/qurl-integrations/.github/workflows/release-please.yml@refs/heads/main' \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            dist/checksums.txt

      - name: Validate generated Homebrew cask
        run: |
          set -euo pipefail
          generated=dist/homebrew/Casks/qurl.rb
          release_version="${CLI_TAG#v}"
          [ "v${release_version}" = "$CLI_TAG" ]
          [ -f "$generated" ] || {
            echo "::error::GoReleaser did not generate the qurl Homebrew cask" >&2
            exit 1
          }
          version_lines=$(awk -v want="version \"${release_version}\"" '
            { line=$0; sub(/^[[:space:]]*/, "", line); if (line == want) count++ }
            END { print count + 0 }
          ' "$generated")
          [ "$version_lines" = 1 ] || {
            echo "::error::generated Homebrew cask does not name the exact CLI version" >&2
            exit 1
          }
          [ "$(grep -Fc "releases/download/${CLI_TAG}/" "$generated")" = 4 ] || {
            echo "::error::generated Homebrew cask does not bind all four release archives" >&2
            exit 1
          }

      - name: Publish the verified CLI release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release edit "$CLI_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --verify-tag
          is_draft="$(gh release view "$CLI_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)"
          [ "$is_draft" = false ] || {
            echo "::error::verified CLI release remained a draft" >&2
            exit 1
          }

      - name: Publish the verified Homebrew cask
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tap_repo=layervai/homebrew-tap
          tap_branch=main
          cask_path=Casks/qurl.rb
          generated=dist/homebrew/Casks/qurl.rb

          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT
          gh api "repos/${tap_repo}/contents/${cask_path}?ref=${tap_branch}" > "$work/current.json"
          current_sha="$(jq -er '.sha | select(test("^[0-9a-f]{40}$"))' "$work/current.json")"
          jq -er .content "$work/current.json" | base64 --decode > "$work/current.rb"
          if cmp -s "$generated" "$work/current.rb"; then
            echo "Homebrew cask already names ${CLI_TAG}."
            exit 0
          fi

          content="$(base64 -w 0 < "$generated")"
          jq -n \
            --arg message "qurl ${CLI_TAG}" \
            --arg content "$content" \
            --arg sha "$current_sha" \
            --arg branch "$tap_branch" \
            '{message:$message,content:$content,sha:$sha,branch:$branch}' |
            gh api --method PUT "repos/${tap_repo}/contents/${cask_path}" --input - |
            jq -e '.commit.sha | test("^[0-9a-f]{40}$")' >/dev/null

      - name: Post recovery instructions on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "## CLI release incomplete"
            echo ""
            echo "The release job did not finish. Before publication, \`${CLI_TAG}\` remains a draft and the Homebrew tap stays on its prior version. If publication succeeded but the final tap update failed, the verified GitHub Release is public and Homebrew remains on its prior version."
            echo ""
            echo "Recovery: for a draft release, fix the cause, then re-run via workflow_dispatch with \`cli_tag=${CLI_TAG}\`, or use **Re-run failed jobs** on this run. Do NOT use 'Re-run all jobs' (release-please will skip this job because the release already exists). Re-uploads are idempotent. If only the Homebrew update failed after publication, rerun the exact cask compare-and-swap after fixing the tap access problem."
          } >> "$GITHUB_STEP_SUMMARY"
