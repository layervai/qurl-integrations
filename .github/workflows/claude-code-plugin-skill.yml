name: "claude-code-plugin: Bundled Skill"

# The Claude Code plugin in plugins/claude-code/qurl ships a copy of the qURL
# agent skill, and a person who installs the plugin gets that copy, not the
# one served at https://layerv.ai/skills/qurl/SKILL.md. The served file is the
# source of truth: when it changes, the copy is out of date until someone
# copies it in again and raises the plugin's version (the plugin's README
# says how). This runs every day against main and fails while the copy is not
# the served file, byte for byte, so that change is known the day it happens.
#
# It gates nothing: there is no pull_request trigger, so no check here can be
# required, and a skill served from another repository cannot hold a PR here
# hostage. The manifest and marketplace files are checked on every PR instead,
# offline, by internal/ciworkflows. A scheduled failure on main reaches people
# through Main CI Notifications (this workflow is registered there; keep the
# trigger list and case arm in sync when renaming). A manual run reports only
# on its own run page; from a branch it checks that branch's copy.
#
# It is its own workflow, not a step in cli-served-skill.yml, because the
# notifier reports a workflow run and not a job: a plugin copy that is a day
# behind must not look the same as a served skill too old for the next CLI
# release, and neither may hide the other.
on:
  schedule:
    # 05:41 UTC: off-peak, offset from the top of the hour to dodge GitHub's
    # scheduled-load spikes, and clear of the CLI's schedules.
    - cron: "41 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

# Keyed by event and ref so no manual run, from a branch or from main, can
# displace main's scheduled run: GitHub keeps only one pending run per group.
concurrency:
  group: claude-code-plugin-skill-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: claude-code-plugin / bundled skill
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No module cache: the checker and the one package it imports use only
      # the standard library, and this job must not be the one that saves the
      # shared cache nearly empty.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      # The served-skill checker is the one piece of code in this tree that
      # fetches the skill; -bundled makes it compare bytes instead of reading
      # the version. Its own output, above the annotation, says which it was:
      # a copy that differs, or a served file it could not read.
      - name: Verify the plugin's skill is the served skill
        timeout-minutes: 5
        run: |
          set -euo pipefail
          go run ./apps/cli/scripts/check-served-skill -bundled plugins/claude-code/qurl/skills/qurl/SKILL.md || {
            echo "::error::the Claude Code plugin's copy of the qURL skill is not the served skill, or the check could not read it; the step log says which and how to update the copy." >&2
            exit 1
          }
