name: "qURL CLI Customer Cleanup"

# The primary workflow reconciles all lanes with one management token. This
# trusted fallback runs only when that cleanup did not pass, including after a
# cancellation. The protected manual entry accepts only verified prior trusted
# journey runs and exists for bounded recovery of older leaks.
on:
  workflow_dispatch:
    inputs:
      source_runs:
        description: "Up to 3 comma-separated trusted journey run_id:workflow_attempt values; recovery resolves the persisted identity attempt"
        required: true
        type: string
  workflow_run:
    workflows: ["cli: Build and Test"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && 'qurl-cli-customer-cleanup-manual' || format('qurl-cli-customer-cleanup-{0}-{1}', github.event.workflow_run.id, github.event.workflow_run.run_attempt) }}
  cancel-in-progress: false

jobs:
  resolve:
    name: Resolve cleanup requirement
    # GitHub creates a workflow_run row for every source completion, but this
    # job performs work only for main or an exact release-tag journey.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.head_branch == 'main' ||
      (github.event.workflow_run.event == 'workflow_dispatch' &&
       startsWith(github.event.workflow_run.display_title, 'CLI release gate '))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    outputs:
      required: ${{ steps.source.outputs.required }}
      source_runs: ${{ steps.source.outputs.source_runs }}
      include_soak: ${{ steps.source.outputs.include_soak }}
    steps:
      - id: source
        name: Require an exact trusted journey run
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_BRANCH: ${{ github.event.workflow_run.head_branch }}
          SOURCE_EVENT: ${{ github.event.workflow_run.event }}
          SOURCE_DISPLAY_TITLE: ${{ github.event.workflow_run.display_title }}
          SOURCE_REPOSITORY: ${{ github.event.workflow_run.head_repository.full_name }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
          SOURCE_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
          SOURCE_WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
          SOURCE_WORKFLOW_PATH: ${{ github.event.workflow_run.path }}
          REQUESTED_SOURCE_RUNS: ${{ inputs.source_runs }}
          WORKFLOW_REPOSITORY: ${{ github.event.workflow_run.repository.full_name }}
        run: |
          set -euo pipefail
          include_soak=false
          case "$GITHUB_EVENT_NAME" in
            workflow_run)
              trusted_ref=false
              if [[ "$SOURCE_BRANCH" == main ]]; then
                trusted_ref=true
              elif [[ "$SOURCE_EVENT" == workflow_dispatch && \
                "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ && \
                "$SOURCE_DISPLAY_TITLE" == "CLI release gate $SOURCE_SHA" ]]; then
                trusted_ref=true
              fi
              [[ "$trusted_ref" == true && \
                "$SOURCE_REPOSITORY" == "$GITHUB_REPOSITORY" && \
                "$WORKFLOW_REPOSITORY" == "$GITHUB_REPOSITORY" && \
                "$SOURCE_WORKFLOW_NAME" == "cli: Build and Test" && \
                "$SOURCE_WORKFLOW_PATH" == .github/workflows/cli.yml ]] || {
                echo "::error::cleanup accepts only an exact trusted same-repository CLI workflow" >&2
                exit 1
              }
              case "$SOURCE_EVENT" in
                push) ;;
                schedule|workflow_dispatch) include_soak=true ;;
                *)
                  echo "::error::cleanup source event is not an approved CLI trigger" >&2
                  exit 1
                  ;;
              esac
              [[ "$SOURCE_RUN_ID" =~ ^[1-9][0-9]{0,18}$ ]] || {
                echo "::error::cleanup source run id is not a positive integer" >&2
                exit 1
              }
              if [[ ! "$SOURCE_RUN_ATTEMPT" =~ ^[1-9][0-9]?$ ]] ||
                (( 10#$SOURCE_RUN_ATTEMPT > 30 )); then
                echo "::error::cleanup source run attempt is outside the 1-30 recovery bound" >&2
                exit 1
              fi
              source_runs="$SOURCE_RUN_ID:$SOURCE_RUN_ATTEMPT"
              ;;
            workflow_dispatch)
              [[ "$GITHUB_REF" == refs/heads/main ]] || {
                echo "::error::manual cleanup must run from main" >&2
                exit 1
              }
              source_runs="$REQUESTED_SOURCE_RUNS"
              ;;
            *) exit 1 ;;
          esac
          [[ "$source_runs" =~ ^[1-9][0-9]{0,18}:[1-9][0-9]?(,[1-9][0-9]{0,18}:[1-9][0-9]?){0,2}$ ]] || {
            echo "::error::cleanup source runs are malformed or exceed the 3-run limit" >&2
            exit 1
          }
          IFS=, read -ra run_specs <<<"$source_runs"
          declare -A seen=()
          resolved_runs=()
          for run_spec in "${run_specs[@]}"; do
            [[ -z "${seen[$run_spec]:-}" ]] || {
              echo "::error::cleanup source runs contain a duplicate" >&2
              exit 1
            }
            seen[$run_spec]=1
            IFS=: read -r run_id run_attempt <<<"$run_spec"
            (( 10#$run_attempt <= 30 )) || {
              echo "::error::cleanup source run attempt exceeds the 30-attempt recovery bound" >&2
              exit 1
            }
            if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
              run=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id")
              jq -e --arg repository "$GITHUB_REPOSITORY" --arg run_attempt "$run_attempt" '
                .status == "completed" and
                (.event == "push" or .event == "schedule" or .event == "workflow_dispatch") and
                (.head_branch == "main" or
                  .display_title == ("CLI release gate " + .head_sha)) and
                .head_repository.full_name == $repository and
                .name == "cli: Build and Test" and
                .path == ".github/workflows/cli.yml" and
                (.run_attempt | tostring) == $run_attempt
              ' <<<"$run" >/dev/null || {
                echo "::error::cleanup source is not one exact trusted same-repository CLI workflow" >&2
                exit 1
              }
              # This flag is request-wide. One scheduled or manual source adds
              # lane 4 to every selected run; extra reconciliation is a safe
              # no-op and is included in the 12-operation timeout budget.
              if [[ "$(jq -r '.event' <<<"$run")" != push ]]; then
                include_soak=true
              fi
            fi
            jobs=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/attempts/$run_attempt/jobs?per_page=100")
            validate_jobs='
              if (.total_count | type) != "number" or .total_count < 0 or .total_count > 100 or
                (.jobs | type) != "array" or (.jobs | length) != .total_count or
                any(.jobs[]; (.name | type) != "string")
              then error("source jobs are malformed or truncated")
              else .
              end
            '
            jq -e "$validate_jobs" <<<"$jobs" >/dev/null
            # A workflow rerun preserves outputs from successful dependency
            # jobs. Find the newest attempt that ran the artifact producer;
            # that is the identity generation used by every rerun journey.
            identity_attempt=$run_attempt
            identity_jobs=$jobs
            artifact_ran=$(jq -r '
              any(.jobs[];
                .name == "cli / customer journey artifacts" and
                .conclusion != "skipped")
            ' <<<"$identity_jobs")
            while [[ "$artifact_ran" != true && "$identity_attempt" -gt 1 ]]; do
              identity_attempt=$((identity_attempt - 1))
              identity_jobs=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/attempts/$identity_attempt/jobs?per_page=100")
              jq -e "$validate_jobs" <<<"$identity_jobs" >/dev/null
              artifact_ran=$(jq -r '
                any(.jobs[];
                  .name == "cli / customer journey artifacts" and
                  .conclusion != "skipped")
              ' <<<"$identity_jobs")
            done
            if [[ "$artifact_ran" != true ]]; then
              if [[ "$GITHUB_EVENT_NAME" == workflow_run ]]; then
                echo "required=false" >>"$GITHUB_OUTPUT"
                exit 0
              fi
              echo "::error::cleanup source has no persisted journey identity attempt" >&2
              exit 1
            fi
            # A completed workflow event can briefly precede its final job
            # conclusion. Only explicit skipped suppresses idempotent cleanup.
            journey_ran=$(jq -r '
              any(.jobs[];
                (.name == "cli / customer journey" or
                  (.name | startswith("cli / customer journey ("))) and
                .conclusion != "skipped")
            ' <<<"$identity_jobs")
            [[ "$journey_ran" == true ]] || {
              if [[ "$GITHUB_EVENT_NAME" == workflow_run ]]; then
                echo "required=false" >>"$GITHUB_OUTPUT"
                exit 0
              fi
              echo "::error::cleanup source did not run the customer journey" >&2
              exit 1
            }
            # A workflow_run event has exactly one source run. A successful
            # primary cleanup makes the fallback unnecessary for that source.
            if [[ "$GITHUB_EVENT_NAME" == workflow_run ]]; then
              cleanup_succeeded=$(jq -r '
                any(.jobs[];
                  .name == "cli / customer journey cleanup" and
                  .conclusion == "success")
              ' <<<"$jobs")
              if [[ "$cleanup_succeeded" == true ]]; then
                echo "required=false" >>"$GITHUB_OUTPUT"
                exit 0
              fi
            fi
            resolved_runs+=("$run_id:$identity_attempt")
          done
          source_runs=$(IFS=,; echo "${resolved_runs[*]}")
          {
            echo "required=true"
            echo "source_runs=$source_runs"
            echo "include_soak=$include_soak"
          } >>"$GITHUB_OUTPUT"

  cleanup:
    name: Reconcile cancelled customer journeys
    needs: resolve
    if: needs.resolve.outputs.required == 'true'
    runs-on: ubuntu-latest
    # Manual recovery accepts at most three source runs. A scheduled/manual
    # source adds the fourth lane, for at most 12 reconciliations under one
    # management token and one two-minute owner inventory. The remaining time
    # covers bounded cleanup writes and runner setup.
    timeout-minutes: 45
    environment: cli-customer-journey-cleanup
    permissions:
      contents: read
    env:
      QURL_ENDPOINT: ${{ secrets.QURL_JOURNEY_ENDPOINT }}
      AUTH_TOKEN_ENDPOINT: ${{ secrets.QURL_JOURNEY_AUTH_TOKEN_ENDPOINT }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Manual recovery runs trusted current-main code. The deterministic
          # run, agent, and resource ID formulas are therefore a recovery
          # contract for prior journeys and need a migration if they change.
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false

      - name: Revoke exact-run resources and credentials
        env:
          AUTH_CLIENT_ID: ${{ secrets.QURL_JOURNEY_AUTH_CLIENT_ID }}
          AUTH_CLIENT_SECRET: ${{ secrets.QURL_JOURNEY_AUTH_CLIENT_SECRET }}
          INCLUDE_SOAK: ${{ needs.resolve.outputs.include_soak }}
          SOURCE_RUNS: ${{ needs.resolve.outputs.source_runs }}
        run: |
          set -euo pipefail
          client_dir=$RUNNER_TEMP/qurl-journey-auth
          cleanup() { scripts/remove-sensitive-tree.sh "$client_dir"; }
          trap cleanup EXIT
          mkdir -m 0700 "$client_dir"
          printf %s "$AUTH_CLIENT_ID" >"$client_dir/client-id"
          printf %s "$AUTH_CLIENT_SECRET" >"$client_dir/client-secret"
          chmod 0600 "$client_dir/client-id" "$client_dir/client-secret"
          unset AUTH_CLIENT_ID AUTH_CLIENT_SECRET
          batch_args=()
          IFS=, read -ra run_specs <<<"$SOURCE_RUNS"
          for run_spec in "${run_specs[@]}"; do
            IFS=: read -r source_run_id source_run_attempt <<<"$run_spec"
            lane_specs=(linux:1:full macos:2:full windows:3:full)
            if [[ "$INCLUDE_SOAK" == true ]]; then
              lane_specs+=(linux:4:soak)
            fi
            for lane_spec in "${lane_specs[@]}"; do
              IFS=: read -r lane lane_id profile <<<"$lane_spec"
              batch_args+=(--run-spec "${source_run_id}${lane_id}:${source_run_attempt}:${lane}:host:${profile}")
            done
          done
          python3 scripts/qurl-cli-ci-credentials.py reconcile-batch \
            --token-endpoint "$AUTH_TOKEN_ENDPOINT" --audience "$QURL_ENDPOINT" \
            --qurl-endpoint "$QURL_ENDPOINT" --client-id-file "$client_dir/client-id" \
            --client-secret-file "$client_dir/client-secret" "${batch_args[@]}"
