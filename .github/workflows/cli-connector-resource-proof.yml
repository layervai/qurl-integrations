name: "cli: Connector Resource Sandbox Proof"

# Attended post-rollout proof only. This workflow intentionally does not run
# on pull requests: it spends a one-shot enrollment credential and mutates one
# sandbox resource. The dedicated Environment must require a reviewer and hold
# a same-owner cleanup JWT replaced for every run. The test rejects that token
# before mutation unless its remaining lifetime is 20 minutes through 2 hours,
# and its mandatory cleanup fails the run if resource or agent removal fails.
# QURL_SANDBOX_ENDPOINT is the canonical API origin https://api.layerv.xyz;
# the CLI appends versioned paths such as /v1/api-keys itself.
# QURL_SANDBOX_ENDPOINT_SHA256 must be
# 6365fdb1bc9a2fcdeb40e9ba3c76154fb2b6a02c60dea9b4536b7bd8dd9a1bd4.
# QURL_CONNECTOR_HUB_HOST must be the exact sandbox NHP Hub name
# hub.nhp.layerv.xyz, which aliases the UDP/443 Hub NLB. The tempting
# hub.sandbox.nhp.layerv.xyz wildcard resolves to a different, TCP-only
# access-control load balancer and is deliberately rejected by the proof.
# rollout_evidence is syntax-checked only: the Environment reviewer is the
# explicit verification boundary that it is the non-superseded, successful
# "Build and Deploy NHP" run for the NHP merge SHA (including its
# consumer_rollout_ready barrier, sequential cell plans, both rolls, and live
# five-alias validation), plus the producer sequence and positive Control
# agent-key inventory receipt named below.
#
# Required order: merge conformance #96 and repin qurl-go plus this CLI to its
# post-squash main commit; merge qurl-service #1413; publish the main-only
# Authority repo@digest/SSM digest; run that exact image's
# qurl-agent-key-inventory for us-east-2, layerv-nhp-sandbox-control, account
# 767397897469 and require exit 0 plus result: PASS; refresh and merge NHP #3921
# so Control applies its same-run freshness barrier; roll every NHP cell with
# the five-operation plugin; only then approve this Environment run.
on:
  workflow_dispatch:
    inputs:
      expected_main_sha:
        description: "Exact qurl-integrations main SHA to prove"
        required: true
        type: string
      rollout_gate:
        description: "Enter five-op-cells-ready only after conformance -> service -> Authority inventory PASS -> NHP Control -> all cells"
        required: true
        type: string
      rollout_evidence:
        description: "Successful non-superseded NHP Build and Deploy run URL for the merge SHA after all cell validation"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: cli-connector-resource-sandbox-proof
  cancel-in-progress: false

jobs:
  preflight:
    name: cli Connector resource proof / preflight
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.verify.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Verify current-main and rollout evidence
        id: verify
        env:
          EXPECTED_MAIN_SHA: ${{ inputs.expected_main_sha }}
          ROLLOUT_GATE: ${{ inputs.rollout_gate }}
          ROLLOUT_EVIDENCE: ${{ inputs.rollout_evidence }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Dispatch this proof from main, not ${GITHUB_REF}"
            exit 1
          fi
          if ! [[ "$EXPECTED_MAIN_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::expected_main_sha must be one exact lowercase 40-hex commit"
            exit 1
          fi
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          current_main="$(git rev-parse origin/main)"
          checked_out="$(git rev-parse HEAD)"
          if [ "$EXPECTED_MAIN_SHA" != "$current_main" ] || [ "$checked_out" != "$current_main" ]; then
            echo "::error::Proof ref is stale: expected, checked-out, and current origin/main must be identical"
            exit 1
          fi
          if [ "$ROLLOUT_GATE" != "five-op-cells-ready" ]; then
            echo "::error::rollout_gate must be five-op-cells-ready after the ordered producer and cell rollout"
            exit 1
          fi
          if ! [[ "$ROLLOUT_EVIDENCE" =~ ^https://github\.com/layervai/nhp/actions/runs/[0-9]+$ ]]; then
            echo "::error::rollout_evidence must be an exact layervai/nhp Actions run URL"
            exit 1
          fi
          echo "sha=${current_main}" >> "$GITHUB_OUTPUT"

  proof:
    name: cli Connector resource proof / deployed sandbox
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: cli-connector-resource-sandbox
      url: ${{ inputs.rollout_evidence }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.preflight.outputs.sha }}

      - name: Reverify current-main after Environment approval
        env:
          EXPECTED_MAIN_SHA: ${{ needs.preflight.outputs.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          current_main="$(git rev-parse origin/main)"
          checked_out="$(git rev-parse HEAD)"
          if [ "$EXPECTED_MAIN_SHA" != "$current_main" ] || [ "$checked_out" != "$current_main" ]; then
            echo "::error::Proof approval went stale: expected, checked-out, and current origin/main must remain identical"
            exit 1
          fi

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Reprove terminal, retryable, and exit-code taxonomy
        run: |
          set -euo pipefail
          go test -race -count=1 -run '^TestResolveResourcePendingPolicy$' \
            ./apps/cli/internal/connector/agent
          go test -race -count=1 -run '^TestSentinelMapping$' \
            ./apps/cli/internal/exitcode

      - name: Run strict deployed Connector resource proof
        env:
          PROOF_MAIN_SHA: ${{ needs.preflight.outputs.sha }}
          ROLLOUT_EVIDENCE: ${{ inputs.rollout_evidence }}
          QURL_CLI_SANDBOX_CONNECTOR_RESOURCE_PROOF: enabled
          QURL_CLI_SANDBOX_ROLLOUT_ATTESTATION: ${{ inputs.rollout_gate }}
          QURL_API_KEY: ${{ secrets.QURL_SANDBOX_API_KEY }}
          QURL_ENDPOINT: ${{ secrets.QURL_SANDBOX_ENDPOINT }}
          QURL_CLI_SANDBOX_ENDPOINT_SHA256: ${{ vars.QURL_SANDBOX_ENDPOINT_SHA256 }}
          QURL_CLI_SANDBOX_CLEANUP_JWT: ${{ secrets.QURL_CLI_SANDBOX_CLEANUP_JWT }}
          # The test fail-closes unless this protected variable is exactly the
          # documented UDP/443 Hub name above; DNS aliases and wildcard names
          # are not accepted as equivalent trust-bootstrap configuration.
          QURL_CONNECTOR_HUB_HOST: ${{ vars.QURL_CONNECTOR_HUB_HOST }}
          QURL_CONNECTOR_HUB_PORT: ${{ vars.QURL_CONNECTOR_HUB_PORT }}
          QURL_CONNECTOR_HUB_SERVER_PUBLIC_KEY_B64: ${{ vars.QURL_CONNECTOR_HUB_SERVER_PUBLIC_KEY_B64 }}
          HTTP_PROXY: ""
          HTTPS_PROXY: ""
          ALL_PROXY: ""
          NO_PROXY: "*"
        run: |
          set -euo pipefail
          unset http_proxy https_proxy all_proxy no_proxy
          proof_log="$RUNNER_TEMP/connector-resource-proof.log"
          api_trap_log="$RUNNER_TEMP/api-layerv-ai-trap.log"

          # Literal production management and agent-bootstrap hostnames, both
          # forced to the same dual-stack TCP trap. Cold enrollment uses the
          # pinned canonical sandbox QURL_ENDPOINT origin. Replay, warm
          # continuity, LST,
          # KNK/ACK, and FRP Login must all succeed while these hosts are dark.
          printf '%s\n' \
            '127.0.0.1 api.layerv.ai' \
            '::1 api.layerv.ai' \
            '127.0.0.1 bootstrap.layerv.ai' \
            '::1 bootstrap.layerv.ai' | sudo -n tee -a /etc/hosts >/dev/null
          sudo -n python3 -u - "$api_trap_log" <<'PY' &
          import select
          import socket
          import sys

          log_path = sys.argv[1]
          listeners = []
          for family, address in (
              (socket.AF_INET, ("127.0.0.1", 443)),
              (socket.AF_INET6, ("::1", 443, 0, 0)),
          ):
              listener = socket.socket(family, socket.SOCK_STREAM)
              listener.setsockopt(socket.SOL_SOCKET, socket.SO_REUSEADDR, 1)
              if family == socket.AF_INET6:
                  listener.setsockopt(socket.IPPROTO_IPV6, socket.IPV6_V6ONLY, 1)
              listener.bind(address)
              listener.listen()
              listeners.append(listener)

          while True:
              readable, _, _ = select.select(listeners, [], [])
              for listener in readable:
                  connection, peer = listener.accept()
                  with connection, open(log_path, "a", encoding="utf-8") as trap_log:
                      trap_log.write(f"connection from {peer!r}\n")
                      trap_log.flush()
          PY
          api_trap_pid=$!
          cleanup() {
            sudo -n kill "$api_trap_pid" 2>/dev/null || true
          }
          trap cleanup EXIT
          sleep 1
          if ! sudo -n kill -0 "$api_trap_pid" 2>/dev/null; then
            echo "::error::Runtime HTTP TCP trap did not start"
            exit 1
          fi

          go test -tags=clisandbox -count=1 -v \
            -run '^TestSandboxConnectorResourceNativeProof$' \
            ./apps/cli/cmd | tee "$proof_log"

          for marker in \
            'cold_create found_existing=false pending_before_dispatch=true' \
            'exact_replay same_nonce=true found_existing=false knk_ack=true login=true runtime_http=zero' \
            'warm_continuity fresh_nonce=true expected_resource_id=true found_existing=true knk_ack=true login=true runtime_http=zero' \
            'identity_conflict code=52503 exit=7 pending=cleared knk=false'; do
            if ! grep -Fq "$marker" "$proof_log"; then
              echo "::error::Missing strict proof marker: ${marker}"
              exit 1
            fi
          done
          if sudo -n test -s "$api_trap_log"; then
            echo "::error::api.layerv.ai or bootstrap.layerv.ai runtime trap observed a TCP/TLS request"
            exit 1
          fi

          {
            echo '### Connector resource sandbox proof'
            echo
            echo "- qurl-integrations SHA: \`${PROOF_MAIN_SHA}\`"
            echo "- Rollout evidence: ${ROLLOUT_EVIDENCE}"
            echo '- Cold create, exact restart replay, warm continuity, deployed 52503, KNK/ACK, and FRP Login: proven'
            echo '- Frozen terminal/retry pending policy and customer exit-code taxonomy: reproven hermetically'
            echo '- Runtime api.layerv.ai and bootstrap.layerv.ai dual-stack TCP trap: zero connections'
          } >> "$GITHUB_STEP_SUMMARY"
