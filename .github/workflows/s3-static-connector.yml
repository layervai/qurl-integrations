name: "origins/s3-static-connector: Build and Publish"

# `on.push.paths` used to gate this workflow, which made the #1022 supersession
# gap unfixable here: when a burst of merges cancelled a pending run, the
# superseding commit produced no run at all to widen a diff base on — so a
# connector change could reach main neither validated nor published. Path
# gating now lives in the `changes` job below.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}/s3-static-connector

jobs:
  changes:
    name: s3-static-connector / detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      # Reading this workflow's own run history is what lets the step below
      # find the last SHA it actually validated.
      actions: read
    outputs:
      # workflow_dispatch is an operator asking for a full build, and it has no
      # diff to filter on; force it true rather than let an empty filter output
      # skip the run. An unresolvable base forces every gate too: a redundant
      # run costs minutes, a wrongly narrow diff ships unvalidated code (#1022).
      s3_static_connector: >-
        ${{ (github.event_name == 'workflow_dispatch' || steps.base.outputs.force == 'true')
            && 'true' || steps.filter.outputs.s3_static_connector }}
    steps:
      # On PRs, paths-filter uses the pull request API; push events need git
      # history to compute the diff.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'push'
        with:
          fetch-depth: 0

      # `cancel-in-progress: false` protects a run already in progress, not one
      # still pending: GitHub keeps at most one pending run per concurrency
      # group, so a burst of merges to main cancels the intermediate runs.
      # Diffing this push alone would then skip the gates for changes that
      # landed in those cancelled runs — every check green, the connector image
      # never rebuilt (#1022). Diff against the last validated SHA instead.
      - name: Resolve validated base
        id: base
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/resolve-validated-base.sh

      # Skipped on workflow_dispatch, which checks nothing out and has no diff
      # to compute, and skipped when no base could be resolved. The job output
      # above already forces both cases true, and running the filter anyway
      # would let a filter error redden this job instead of honouring the
      # fail-closed intent.
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        if: github.event_name != 'workflow_dispatch' && steps.base.outputs.force != 'true'
        with:
          # Empty on pull_request, where the push-only step above never ran and
          # paths-filter takes its PR API path instead.
          base: ${{ steps.base.outputs.sha }}
          filters: |
            s3_static_connector:
              # Source of truth for connector-impacting paths on PR and main push events.
              - 'origins/s3-static-connector/**'
              - '.github/workflows/s3-static-connector.yml'

  test:
    name: s3-static-connector / test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: changes
    if: needs.changes.outputs.s3_static_connector == 'true'
    defaults:
      run:
        working-directory: origins/s3-static-connector
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Ensure shell tools
        run: |
          if ! command -v envsubst >/dev/null || ! command -v shellcheck >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y gettext-base shellcheck
          fi

      - name: Render config goldens
        run: bash test/render_test.sh

      - name: Shell lint
        run: shellcheck -S warning render.sh cachectl.sh entrypoint.sh test/render_test.sh test/cachectl_test.sh test/behavior_test.sh test/qurl_connector_release_contract.sh

      - name: Cache-control contract
        run: bash test/cachectl_test.sh

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build linux/amd64 image
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: origins/s3-static-connector
          platforms: linux/amd64
          push: false
          load: true
          tags: s3-static-connector:test
          cache-from: type=gha,scope=s3-static-connector-amd64
          cache-to: type=gha,mode=max,scope=s3-static-connector-amd64

      - name: Runtime behavior contract (linux/amd64)
        run: SKIP_BUILD=true PLATFORM=linux/amd64 IMG=s3-static-connector:test bash test/behavior_test.sh

      - name: Build linux/arm64 image
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: origins/s3-static-connector
          platforms: linux/arm64
          push: false
          load: true
          tags: s3-static-connector:test-arm64
          cache-from: type=gha,scope=s3-static-connector-arm64
          cache-to: type=gha,mode=max,scope=s3-static-connector-arm64

      - name: Runtime behavior contract (linux/arm64)
        run: SKIP_BUILD=true PLATFORM=linux/arm64 IMG=s3-static-connector:test-arm64 bash test/behavior_test.sh

  publish:
    name: s3-static-connector / publish
    runs-on: ubuntu-latest
    # Gate on the aggregate rather than on `test` directly — the same shape as
    # slack/discord `trigger-deploy`. It keeps publishing behind every gate the
    # aggregate enforces, and it keeps this job out of the quality-gate set that
    # internal/ciworkflows derives from `if:` + `needs:` (a main-push-only
    # job inside `required.needs` would fail the aggregate on every PR).
    needs: [changes, required]
    # `required` is `if: always()`, so a failed gate fails it and skips this job.
    # Publishing at main's tip after a superseded run is the intended behaviour:
    # the image is tagged with the SHA that main actually reached.
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      needs.changes.outputs.s3_static_connector == 'true'
    permissions:
      contents: read
      packages: write
    timeout-minutes: 20
    defaults:
      run:
        working-directory: origins/s3-static-connector
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The PR test job's loaded images are intentionally throwaway. Publishing
      # builds a fresh multi-arch candidate, then tests that exact digest before
      # promoting tags. Failed candidates remain unpromoted by digest only;
      # cleanup is package-retention housekeeping, not deploy state.
      - name: Build candidate image
        id: candidate
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: origins/s3-static-connector
          platforms: linux/amd64,linux/arm64
          provenance: true
          sbom: true
          outputs: type=image,name=${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          cache-from: |
            type=gha,scope=s3-static-connector-amd64
            type=gha,scope=s3-static-connector-arm64
            type=gha,scope=s3-static-connector-publish
          cache-to: type=gha,mode=max,scope=s3-static-connector-publish

      - name: Resolve candidate platform manifests
        id: candidate_platforms
        env:
          CANDIDATE_IMAGE: ${{ env.IMAGE_NAME }}@${{ steps.candidate.outputs.digest }}
        run: |
          docker buildx imagetools inspect --raw "$CANDIDATE_IMAGE" > /tmp/candidate.json

          for arch in amd64 arm64; do
            digest="$(jq -er --arg arch "$arch" '
              [.manifests[]
                | select(.platform.os == "linux" and .platform.architecture == $arch)
                | .digest]
              | if length == 1 then
                  .[0]
                else
                  error("expected exactly one linux/\($arch) manifest, found \(length)")
                end
            ' /tmp/candidate.json)"
            echo "${arch}_image=${IMAGE_NAME}@${digest}" >> "$GITHUB_OUTPUT"
          done

      - name: Runtime behavior contract (candidate linux/amd64)
        env:
          CANDIDATE_IMAGE: ${{ steps.candidate_platforms.outputs.amd64_image }}
        run: SKIP_BUILD=true PLATFORM=linux/amd64 IMG="$CANDIDATE_IMAGE" bash test/behavior_test.sh

      - name: Runtime behavior contract (candidate linux/arm64)
        env:
          CANDIDATE_IMAGE: ${{ steps.candidate_platforms.outputs.arm64_image }}
        run: SKIP_BUILD=true PLATFORM=linux/arm64 IMG="$CANDIDATE_IMAGE" bash test/behavior_test.sh

      - name: Promote tested image tags
        env:
          CANDIDATE_IMAGE: ${{ env.IMAGE_NAME }}@${{ steps.candidate.outputs.digest }}
        run: |
          docker buildx imagetools create \
            --tag "${IMAGE_NAME}:main" \
            --tag "${IMAGE_NAME}:${GITHUB_SHA}" \
            "$CANDIDATE_IMAGE"

      - name: Verify promoted tags reference tested manifests
        env:
          CANDIDATE_IMAGE: ${{ env.IMAGE_NAME }}@${{ steps.candidate.outputs.digest }}
        run: |
          docker buildx imagetools inspect --raw "$CANDIDATE_IMAGE" > /tmp/candidate.json
          docker buildx imagetools inspect --raw "${IMAGE_NAME}:main" > /tmp/main.json
          docker buildx imagetools inspect --raw "${IMAGE_NAME}:${GITHUB_SHA}" > /tmp/sha.json

          # Verify the load-bearing platform manifests. The build-push-action
          # publish step owns provenance/SBOM attestation emission for the
          # candidate digest.
          extract_platform_manifests() {
            jq -S '
              [
                .manifests[]
                | select(.platform.os == "linux" and (.platform.architecture == "amd64" or .platform.architecture == "arm64"))
                | {architecture: .platform.architecture, digest: .digest}
              ]
              | sort_by(.architecture)
            ' "$1"
          }

          extract_platform_manifests /tmp/candidate.json > /tmp/tested-manifests.json
          extract_platform_manifests /tmp/main.json > /tmp/main-manifests.json
          extract_platform_manifests /tmp/sha.json > /tmp/sha-manifests.json

          diff -u /tmp/tested-manifests.json /tmp/main-manifests.json
          diff -u /tmp/tested-manifests.json /tmp/sha-manifests.json

  required:
    name: s3-static-connector / required
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    # Every connector quality gate must be listed here; s3-static-connector /
    # required only validates jobs in this needs set. `publish` is deliberately
    # absent: it is a main-push-only side effect, and a PR would always see it
    # skipped. display_names below is annotation-only.
    needs: [changes, test]
    if: always()
    steps:
      - name: Verify connector CI result
        shell: bash
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          CONNECTOR_CHANGED: ${{ needs.changes.outputs.s3_static_connector }}
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          if [ "$CHANGES_RESULT" != "success" ]; then
            echo "::error::s3-static-connector / detect changes concluded $CHANGES_RESULT"
            exit 1
          fi

          case "$CONNECTOR_CHANGED" in
            true)
              ;;
            false)
              echo "No connector-impacting changes detected; connector CI is not required."
              exit 0
              ;;
            *)
              echo "::error::s3-static-connector / detect changes emitted unexpected s3_static_connector output: ${CONNECTOR_CHANGED:-<empty>}"
              exit 1
              ;;
          esac

          display_name() {
            case "$1" in
              test)
                echo "s3-static-connector / test"
                ;;
              *)
                echo "$1"
                ;;
            esac
          }

          failed=0
          needs_rows="$(jq -r 'to_entries[] | [.key, (.value.result // "")] | @tsv' <<<"$NEEDS_JSON")"
          while IFS=$'\t' read -r job result; do
            [ -n "$job" ] || continue
            if [ "$job" = "changes" ]; then
              # The change detector is checked above; it is not a quality gate.
              continue
            fi
            if [ "$result" != "success" ]; then
              # Connector-impacting changes require every quality gate listed
              # in needs to run and pass; skipped/cancelled is a failed gate.
              echo "::error::$(display_name "$job") concluded ${result:-<empty>}"
              failed=1
            fi
          done <<<"$needs_rows"

          exit "$failed"
