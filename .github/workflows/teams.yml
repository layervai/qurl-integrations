name: "teams: Build and Test"

# Path filtering lives in the `changes` job below, NOT in `on: paths:`.
# A workflow skipped by a path filter never reports its checks, so a
# `teams / required` branch-protection rule would block every PR that
# doesn't touch apps/teams. The detector + always-running aggregate keeps
# the check reporting on every PR — matching slack/discord/chrome-extension/shared.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Node version is read from apps/teams/.nvmrc below so CI and local dev (nvm)
# stay in lock-step. Avoid adding a NODE_VERSION env var or inline version — it would drift.

jobs:
  changes:
    name: teams / detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      teams: ${{ steps.filter.outputs.teams }}
    steps:
      # On PRs, paths-filter uses the pull request API; push events need git
      # history to compute the diff.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'push'
        with:
          fetch-depth: 0

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            teams:
              # Source of truth for Teams-impacting paths on PR and main push events.
              # No 'shared/**' here: shared/ is Go, and apps/teams is TypeScript.
              - 'apps/teams/**'
              - '.github/workflows/teams.yml'

  build-and-test:
    name: teams / build and test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: changes
    if: needs.changes.outputs.teams == 'true'
    defaults:
      run:
        working-directory: apps/teams
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: apps/teams/.nvmrc
          cache: 'npm'
          cache-dependency-path: apps/teams/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

  required:
    name: teams / required
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    # Every Teams quality gate must be listed here; teams / required only
    # validates jobs in this needs set. display_names below is annotation-only.
    needs: [changes, build-and-test]
    if: always()
    steps:
      - name: Verify Teams CI result
        shell: bash
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          TEAMS_CHANGED: ${{ needs.changes.outputs.teams }}
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          if [ "$CHANGES_RESULT" != "success" ]; then
            echo "::error::teams / detect changes concluded $CHANGES_RESULT"
            exit 1
          fi

          case "$TEAMS_CHANGED" in
            true)
              ;;
            false)
              echo "No Teams-impacting changes detected; Teams CI is not required."
              exit 0
              ;;
            *)
              echo "::error::teams / detect changes emitted unexpected teams output: ${TEAMS_CHANGED:-<empty>}"
              exit 1
              ;;
          esac

          display_name() {
            case "$1" in
              build-and-test)
                echo "teams / build and test"
                ;;
              *)
                echo "$1"
                ;;
            esac
          }

          failed=0
          needs_rows="$(jq -r 'to_entries[] | [.key, (.value.result // "")] | @tsv' <<<"$NEEDS_JSON")"
          while IFS=$'\t' read -r job result; do
            [ -n "$job" ] || continue
            if [ "$job" = "changes" ]; then
              # The change detector is checked above; it is not a Teams quality gate.
              continue
            fi
            if [ "$result" != "success" ]; then
              # Teams-impacting changes require every quality gate listed in
              # needs to run and pass; skipped/cancelled is a failed gate.
              echo "::error::$(display_name "$job") concluded ${result:-<empty>}"
              failed=1
            fi
          done <<<"$needs_rows"

          exit "$failed"
