name: "qURL CLI Customer Journey"

# workflow_run loads this file from the default branch. This live workflow
# accepts only an exact same-repository push to main. Pull requests build the
# same packaged artifacts without credentials; the live journey starts only
# after that source reaches main and remains a required pre-release gate.
# `cli-connector-resource-sandbox` owns the private live-journey inputs and six
# M2M secrets: one distinct Auth0 client ID and secret for each Linux, macOS,
# and Windows lane. Each client maps to a different test-only owner that holds
# no state outside this gate. The environment also holds
# QURL_SANDBOX_AUTH0_TOKEN_ENDPOINT as a variable. Each lane mints, uses, and
# revokes its disposable customer key on one protected runner. Candidate code
# never receives the M2M authority. The separate main-only controller
# environment holds the same six M2M secrets only for exact-run fallback
# reconciliation after a cancelled runner. Each M2M client grants exactly
# qurl:agent, qurl:read, and qurl:write and issues access tokens with a lifetime
# from one through two hours.
on:
  workflow_run:
    workflows: ["cli: Build and Test"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: qurl-cli-customer-journey-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
  cancel-in-progress: false

jobs:
  resolve:
    name: Resolve exact CLI producer
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    outputs:
      required: ${{ steps.producer.outputs.required }}
    steps:
      - id: producer
        name: Require one exact artifact producer
        env:
          DEFAULT_REF: ${{ github.ref }}
          SOURCE_BRANCH: ${{ github.event.workflow_run.head_branch }}
          GH_TOKEN: ${{ github.token }}
          SOURCE_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          SOURCE_EVENT: ${{ github.event.workflow_run.event }}
          SOURCE_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          SOURCE_REPOSITORY: ${{ github.event.workflow_run.head_repository.full_name }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
          WORKFLOW_REPOSITORY: ${{ github.event.workflow_run.repository.full_name }}
        run: |
          set -euo pipefail
          [[ "$DEFAULT_REF" == refs/heads/main && "$SOURCE_BRANCH" == main ]] || {
            echo "::error::customer journeys accept only an exact main push" >&2
            exit 1
          }
          [[ "$SOURCE_EVENT" == push && "$SOURCE_REPOSITORY" == "$GITHUB_REPOSITORY" && \
            "$WORKFLOW_REPOSITORY" == "$GITHUB_REPOSITORY" ]] || {
            echo "::error::customer journeys accept only a same-repository push" >&2
            exit 1
          }
          [[ "$SOURCE_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo "::error::customer journey source SHA is not exact" >&2
            exit 1
          }
          jobs=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID/jobs?per_page=100")
          producer=$(jq -c '
            if (.total_count | type) != "number" or .total_count > 100 or
              (.jobs | type) != "array" or (.jobs | length) != .total_count
            then error("source job response is malformed or truncated")
            else [.jobs[] | select(.name == "cli / customer journey artifacts")]
              | if length == 1 then .[0] else error("expected one artifact producer") end
            end
          ' <<<"$jobs")
          conclusion=$(jq -r '.conclusion' <<<"$producer")
          if [[ "$conclusion" == skipped && "$SOURCE_CONCLUSION" == success ]]; then
            echo "required=false" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          [[ "$conclusion" == success && "$SOURCE_CONCLUSION" == success ]] || {
            echo "::error::source CLI workflow did not pass the exact artifact producer and quality gates" >&2
            exit 1
          }
          echo "required=true" >>"$GITHUB_OUTPUT"

  journey:
    name: Customer journey / ${{ matrix.lane }}
    needs: resolve
    if: needs.resolve.outputs.required == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: linux
            lane_id: 1
            os: ubuntu-latest
            test_name: TestSandboxLinuxDefaultDaemonLifecycle
            auth0_client_id_secret: QURL_SANDBOX_AUTH0_CLIENT_ID_LINUX
            auth0_client_secret_secret: QURL_SANDBOX_AUTH0_CLIENT_SECRET_LINUX
          - lane: macos
            lane_id: 2
            os: macos-latest
            test_name: TestSandboxMacOSDefaultDaemonLifecycle
            auth0_client_id_secret: QURL_SANDBOX_AUTH0_CLIENT_ID_MACOS
            auth0_client_secret_secret: QURL_SANDBOX_AUTH0_CLIENT_SECRET_MACOS
          - lane: windows
            lane_id: 3
            os: windows-latest
            test_name: TestSandboxWindowsDefaultDaemonFullCustomerLifecycle
            auth0_client_id_secret: QURL_SANDBOX_AUTH0_CLIENT_ID_WINDOWS
            auth0_client_secret_secret: QURL_SANDBOX_AUTH0_CLIENT_SECRET_WINDOWS
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    environment: cli-connector-resource-sandbox
    permissions:
      actions: read
      contents: read
    env:
      QURL_ENDPOINT: ${{ secrets.QURL_SANDBOX_ENDPOINT }}
      QURL_SANDBOX_QV2_ISSUER_KEY: ${{ vars.QURL_SANDBOX_QV2_ISSUER_KEY }}
      QURL_SANDBOX_QV2_RELAY_URL: ${{ vars.QURL_SANDBOX_QV2_RELAY_URL }}
      QURL_CONNECTOR_HUB_HOST: ${{ vars.QURL_CONNECTOR_HUB_HOST }}
      QURL_CONNECTOR_HUB_PORT: ${{ vars.QURL_CONNECTOR_HUB_PORT }}
      QURL_CONNECTOR_HUB_SERVER_PUBLIC_KEY_B64: ${{ vars.QURL_CONNECTOR_HUB_SERVER_PUBLIC_KEY_B64 }}
      AUTH0_TOKEN_ENDPOINT: ${{ vars.QURL_SANDBOX_AUTH0_TOKEN_ENDPOINT }}
      SOURCE_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
      SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
      SOURCE_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
      QURL_SHARING_RUNTIME: host
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          path: orchestrator
          persist-credentials: false

      # The exact main push supplies both qurl and this harness. Pull-request
      # artifacts never enter a job that has private live-journey inputs.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: orchestrator/go.mod
          cache: true

      - name: Start the Linux user service manager
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          user_id=$(id -u)
          user_name=$(id -un)
          runtime_dir=/run/user/$user_id
          sudo loginctl enable-linger "$user_name"
          sudo systemctl start "user@${user_id}.service"
          for _ in $(seq 1 50); do
            [[ -S "$runtime_dir/bus" ]] && break
            sleep 0.2
          done
          [[ -S "$runtime_dir/bus" ]] || {
            echo "systemd user bus is unavailable" >&2
            exit 1
          }
          {
            echo "XDG_RUNTIME_DIR=$runtime_dir"
            echo "DBUS_SESSION_BUS_ADDRESS=unix:path=$runtime_dir/bus"
          } >>"$GITHUB_ENV"
          XDG_RUNTIME_DIR=$runtime_dir \
            DBUS_SESSION_BUS_ADDRESS=unix:path=$runtime_dir/bus \
            systemctl --user show-environment >/dev/null

      - name: Build the trusted customer-journey harness
        if: runner.os != 'Windows'
        shell: bash
        working-directory: orchestrator
        env:
          GOFLAGS: -mod=readonly
          GOWORK: off
        run: go test -c -trimpath -tags=clisandbox -o "$RUNNER_TEMP/qurl-customer-journey.test" ./apps/cli/cmd

      - name: Build the trusted customer-journey harness
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: orchestrator
        env:
          GOFLAGS: -mod=readonly
          GOWORK: off
        run: go test -c -trimpath -tags=clisandbox -o "$env:RUNNER_TEMP/qurl-customer-journey.test.exe" ./apps/cli/cmd

      - name: Require the selected customer test
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          selected=$("$RUNNER_TEMP/qurl-customer-journey.test" -test.list '^${{ matrix.test_name }}$')
          [[ "$selected" == '${{ matrix.test_name }}' ]]

      - name: Require the selected customer test
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $test = Join-Path $env:RUNNER_TEMP 'qurl-customer-journey.test.exe'
          $selected = @(& $test -test.list '^${{ matrix.test_name }}$')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($selected.Count -ne 1 -or $selected[0] -ne '${{ matrix.test_name }}') {
            throw 'selected customer-journey test is not in the trusted harness'
          }

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: qurl-customer-journey-${{ github.event.workflow_run.head_sha }}-${{ github.event.workflow_run.run_attempt }}
          path: dist
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          digest-mismatch: error

      - name: Verify exact packaged artifacts
        shell: bash
        run: >-
          python3 orchestrator/scripts/verify-cli-customer-journey-artifacts.py
          dist "$GITHUB_REPOSITORY" "$SOURCE_HEAD_SHA" "$SOURCE_RUN_ID" "$SOURCE_RUN_ATTEMPT"

      - name: Select this runner's exact artifact
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          case "$RUNNER_OS/$(uname -m)" in
            Linux/x86_64) suffix=linux-amd64 ;;
            macOS/x86_64) suffix=darwin-amd64 ;;
            macOS/arm64) suffix=darwin-arm64 ;;
            *) echo "::error::unsupported journey runner platform" >&2; exit 1 ;;
          esac
          chmod 0500 "dist/qurl-$suffix" "$RUNNER_TEMP/qurl-customer-journey.test"
          {
            echo "QURL_CLI_SANDBOX_BINARY=$GITHUB_WORKSPACE/dist/qurl-$suffix"
            echo "QURL_CLI_SANDBOX_QURL_BINARY=$GITHUB_WORKSPACE/dist/qurl-$suffix"
            echo "QURL_CUSTOMER_JOURNEY_TEST=$RUNNER_TEMP/qurl-customer-journey.test"
            echo "QURL_SHARING_RUN_ID=${SOURCE_RUN_ID}${{ matrix.lane_id }}"
            echo "QURL_SHARING_RUN_ATTEMPT=$SOURCE_RUN_ATTEMPT"
          } >>"$GITHUB_ENV"

      - name: Select this runner's exact artifact
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $qurl = Join-Path $env:GITHUB_WORKSPACE 'dist/qurl-windows-amd64.exe'
          $test = Join-Path $env:RUNNER_TEMP 'qurl-customer-journey.test.exe'
          "QURL_CLI_SANDBOX_BINARY=$qurl" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "QURL_CLI_SANDBOX_QURL_BINARY=$qurl" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "QURL_CUSTOMER_JOURNEY_TEST=$test" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "QURL_SHARING_RUN_ID=$($env:SOURCE_RUN_ID)${{ matrix.lane_id }}" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "QURL_SHARING_RUN_ATTEMPT=$($env:SOURCE_RUN_ATTEMPT)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Mint this lane's disposable key in place
        if: runner.os != 'Windows'
        shell: bash
        env:
          AUTH0_CLIENT_ID: ${{ secrets[matrix.auth0_client_id_secret] }}
          AUTH0_CLIENT_SECRET: ${{ secrets[matrix.auth0_client_secret_secret] }}
        run: |
          set -euo pipefail
          client_dir=$RUNNER_TEMP/qurl-cli-ci-auth0
          credential_dir=$RUNNER_TEMP/qurl-cli-ci-credential
          key_dir=$RUNNER_TEMP/qurl-customer-key
          cleanup_id_dir=$RUNNER_TEMP/qurl-cli-ci-cleanup-ids
          remove_authority() {
            orchestrator/scripts/remove-sensitive-tree.sh "$client_dir" "$credential_dir"
          }
          trap remove_authority EXIT
          mkdir -m 0700 "$client_dir" "$credential_dir" "$key_dir" "$cleanup_id_dir"
          printf %s "$AUTH0_CLIENT_ID" >"$client_dir/client-id"
          printf %s "$AUTH0_CLIENT_SECRET" >"$client_dir/client-secret"
          chmod 0600 "$client_dir/client-id" "$client_dir/client-secret"
          unset AUTH0_CLIENT_ID AUTH0_CLIENT_SECRET
          python3 orchestrator/scripts/qurl-cli-ci-credentials.py create \
            --token-endpoint "$AUTH0_TOKEN_ENDPOINT" --audience "$QURL_ENDPOINT" \
            --qurl-endpoint "$QURL_ENDPOINT" --client-id-file "$client_dir/client-id" \
            --client-secret-file "$client_dir/client-secret" --output-dir "$credential_dir" \
            --run-id "${SOURCE_RUN_ID}${{ matrix.lane_id }}" --run-attempt "$SOURCE_RUN_ATTEMPT" \
            --lane "${{ matrix.lane }}"
          install -m 0600 "$credential_dir/api-key" "$key_dir/api-key"
          key_file=$RUNNER_TEMP/qurl-customer-key/api-key
          [[ -f "$key_file" && ! -L "$key_file" && $(find "$key_dir" -type f | wc -l) -eq 1 ]]
          key=$(<"$key_file")
          [[ "$key" == lv_live_* || "$key" == lv_test_* ]]
          echo "::add-mask::$key"
          {
            echo "QURL_API_KEY_FILE=$key_file"
            echo "QURL_CLI_CI_CLEANUP_ID_DIR=$cleanup_id_dir"
          } >>"$GITHUB_ENV"

      - name: Mint this lane's disposable key in place
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          AUTH0_CLIENT_ID: ${{ secrets[matrix.auth0_client_id_secret] }}
          AUTH0_CLIENT_SECRET: ${{ secrets[matrix.auth0_client_secret_secret] }}
        run: |
          $clientDir = Join-Path $env:RUNNER_TEMP 'qurl-cli-ci-auth0'
          $credentialDir = Join-Path $env:RUNNER_TEMP 'qurl-cli-ci-credential'
          $keyDir = Join-Path $env:RUNNER_TEMP 'qurl-customer-key'
          $cleanupIDDir = Join-Path $env:RUNNER_TEMP 'qurl-cli-ci-cleanup-ids'
          try {
            foreach ($path in @($clientDir, $credentialDir, $keyDir, $cleanupIDDir)) {
              New-Item -ItemType Directory -Path $path -ErrorAction Stop | Out-Null
              & icacls.exe $path /inheritance:r /grant:r "${env:USERNAME}:(OI)(CI)(F)" '*S-1-5-18:(OI)(CI)(F)' '*S-1-5-32-544:(OI)(CI)(F)' | Out-Null
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            }
            $clientIDFile = Join-Path $clientDir 'client-id'
            $clientSecretFile = Join-Path $clientDir 'client-secret'
            [IO.File]::WriteAllText($clientIDFile, $env:AUTH0_CLIENT_ID)
            [IO.File]::WriteAllText($clientSecretFile, $env:AUTH0_CLIENT_SECRET)
            Remove-Item Env:AUTH0_CLIENT_ID, Env:AUTH0_CLIENT_SECRET -ErrorAction SilentlyContinue
            python orchestrator/scripts/qurl-cli-ci-credentials.py create `
              --token-endpoint $env:AUTH0_TOKEN_ENDPOINT --audience $env:QURL_ENDPOINT `
              --qurl-endpoint $env:QURL_ENDPOINT --client-id-file $clientIDFile `
              --client-secret-file $clientSecretFile --output-dir $credentialDir `
              --run-id "$($env:SOURCE_RUN_ID)${{ matrix.lane_id }}" --run-attempt $env:SOURCE_RUN_ATTEMPT `
              --lane '${{ matrix.lane }}'
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $apiKey = Join-Path $keyDir 'api-key'
            Copy-Item -LiteralPath (Join-Path $credentialDir 'api-key') -Destination $apiKey -ErrorAction Stop
            $key = [IO.File]::ReadAllText($apiKey)
            if ($key -notmatch '^lv_(?:live|test)_') { throw 'disposable key is malformed' }
            Write-Output "::add-mask::$key"
            "QURL_API_KEY=$key" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            "QURL_CLI_CI_CLEANUP_ID_DIR=$cleanupIDDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          } finally {
            foreach ($path in @($clientDir, $credentialDir)) {
              if (Test-Path -LiteralPath $path) { Remove-Item -LiteralPath $path -Recurse -Force }
              if (Test-Path -LiteralPath $path) { throw 'standing authority remained on the customer runner' }
            }
          }

      - name: Run the packaged customer journey
        if: runner.os != 'Windows'
        shell: bash
        env:
          QURL_CLI_SANDBOX_LINUX_DAEMON: ${{ matrix.lane == 'linux' && 'enabled' || '' }}
          QURL_CLI_SANDBOX_MACOS_DAEMON: ${{ matrix.lane == 'macos' && 'enabled' || '' }}
        run: |
          set -euo pipefail
          cd orchestrator/apps/cli/cmd
          journey_output=$RUNNER_TEMP/qurl-customer-journey.out
          journey_status=0
          set +e
          "$QURL_CUSTOMER_JOURNEY_TEST" -test.v -test.count=1 -test.run '^${{ matrix.test_name }}$' \
            2>&1 | tee "$journey_output"
          journey_status=${PIPESTATUS[0]}
          set -e
          test_name='${{ matrix.test_name }}'
          pass_count=$(awk -v name="$test_name" '$0 ~ "^--- PASS: " name " \\(" { count++ } END { print count + 0 }' "$journey_output")
          skip_count=$(awk '$0 ~ /^[[:space:]]*--- SKIP:/ { count++ } END { print count + 0 }' "$journey_output")
          if [[ "$pass_count" != 1 || "$skip_count" != 0 ]]; then
            echo "::error::packaged customer journey must report one exact top-level PASS and no SKIP" >&2
            exit 1
          fi
          if (( journey_status != 0 )); then
            echo "::error::packaged customer journey exited with status $journey_status" >&2
            exit "$journey_status"
          fi

      - name: Run the packaged customer journey
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          QURL_CLI_SANDBOX_WINDOWS_DAEMON: enabled
        run: |
          Set-Location orchestrator/apps/cli/cmd
          $testName = '${{ matrix.test_name }}'
          $journeyOutput = @(& $env:QURL_CUSTOMER_JOURNEY_TEST -test.v -test.count=1 -test.run "^$testName$" 2>&1)
          $journeyStatus = $LASTEXITCODE
          $journeyOutput | Write-Output
          $passPattern = '^--- PASS: ' + [Regex]::Escape($testName) + ' \('
          $passCount = @($journeyOutput | Where-Object { $_ -match $passPattern }).Count
          $skipCount = @($journeyOutput | Where-Object { $_ -match '^\s*--- SKIP:' }).Count
          if ($passCount -ne 1 -or $skipCount -ne 0) {
            throw 'packaged customer journey must report one exact top-level PASS and no SKIP'
          }
          if ($journeyStatus -ne 0) { exit $journeyStatus }

      # A candidate daemon runs as this runner's user. It must be absent before
      # a later step puts M2M cleanup authority on the same machine.
      - id: fence-posix-service
        name: Fence the packaged POSIX background service
        if: always() && runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          label=ai.layerv.qurl.share-daemon
          case "$RUNNER_OS" in
            Linux)
              unit=ai.layerv.qurl.share-daemon.service
              systemctl --user disable --now "$unit" >/dev/null 2>&1 || true
              definition=$HOME/.config/systemd/user/$unit
              rm -f -- "$definition"
              systemctl --user daemon-reload
              if systemctl --user is-active --quiet "$unit"; then
                echo "::error::qURL user service remains active" >&2
                exit 1
              fi
              [[ ! -e "$definition" && ! -L "$definition" ]]
              ;;
            macOS)
              service="gui/$(id -u)/$label"
              launchctl bootout "$service" >/dev/null 2>&1 || true
              definition=$HOME/Library/LaunchAgents/ai.layerv.qurl.share-daemon.plist
              rm -f -- "$definition"
              if launchctl print "$service" >/dev/null 2>&1; then
                echo "::error::qURL user service remains loaded" >&2
                exit 1
              fi
              [[ ! -e "$definition" && ! -L "$definition" ]]
              ;;
            *)
              echo "::error::unsupported POSIX service manager" >&2
              exit 1
              ;;
          esac

      - id: fence-windows-service
        name: Fence the packaged Windows background service
        if: always() && runner.os == 'Windows'
        shell: pwsh
        run: |
          $label = 'ai.layerv.qurl.share-daemon'
          $sid = [Security.Principal.WindowsIdentity]::GetCurrent().User.Value
          $sha = [Security.Cryptography.SHA256]::Create()
          try {
            $digest = $sha.ComputeHash([Text.Encoding]::UTF8.GetBytes("$sid`0$label"))
          } finally {
            $sha.Dispose()
          }
          $suffix = -join $digest[0..7].ForEach({ $_.ToString('x2') })
          $taskName = "$label.$suffix"
          $task = Get-ScheduledTask -TaskName $taskName -ErrorAction SilentlyContinue
          if ($null -ne $task) {
            Disable-ScheduledTask -InputObject $task -ErrorAction Stop | Out-Null
            if ($task.State -eq 'Running') {
              Stop-ScheduledTask -InputObject $task -ErrorAction Stop
            }
            $deadline = [DateTime]::UtcNow.AddSeconds(15)
            do {
              $task = Get-ScheduledTask -TaskName $taskName -ErrorAction SilentlyContinue
              if ($null -eq $task -or $task.State -ne 'Running') { break }
              Start-Sleep -Milliseconds 200
            } while ([DateTime]::UtcNow -lt $deadline)
            if ($null -ne $task -and $task.State -eq 'Running') {
              throw 'qURL scheduled task did not stop within the bounded fence'
            }
            if ($null -ne $task) {
              Unregister-ScheduledTask -InputObject $task -Confirm:$false -ErrorAction Stop
            }
          }
          if ($null -ne (Get-ScheduledTask -TaskName $taskName -ErrorAction SilentlyContinue)) {
            throw 'qURL scheduled task remains installed'
          }

      - id: remove-posix-key
        name: Remove the local disposable key
        if: always() && runner.os != 'Windows'
        shell: bash
        run: |
          orchestrator/scripts/remove-sensitive-tree.sh "$RUNNER_TEMP/qurl-customer-key"
          echo "QURL_API_KEY_FILE=" >>"$GITHUB_ENV"

      - id: remove-windows-key
        name: Remove the local disposable key
        if: always() && runner.os == 'Windows'
        shell: pwsh
        run: |
          $path = Join-Path $env:RUNNER_TEMP 'qurl-customer-key'
          if (Test-Path -LiteralPath $path) { Remove-Item -LiteralPath $path -Recurse -Force }
          if (Test-Path -LiteralPath $path) { throw 'local disposable key remains on the customer runner' }
          "QURL_API_KEY=" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Reconcile this POSIX lane after the service fence
        if: always() && runner.os != 'Windows' && steps.fence-posix-service.outcome == 'success' && steps.remove-posix-key.outcome == 'success'
        shell: bash
        env:
          AUTH0_CLIENT_ID: ${{ secrets[matrix.auth0_client_id_secret] }}
          AUTH0_CLIENT_SECRET: ${{ secrets[matrix.auth0_client_secret_secret] }}
        run: |
          set -euo pipefail
          client_dir=$RUNNER_TEMP/qurl-cli-ci-auth0
          cleanup_id_dir=$RUNNER_TEMP/qurl-cli-ci-cleanup-ids
          remove_authority() {
            orchestrator/scripts/remove-sensitive-tree.sh "$client_dir" "$cleanup_id_dir"
          }
          trap remove_authority EXIT
          mkdir -m 0700 "$client_dir"
          printf %s "$AUTH0_CLIENT_ID" >"$client_dir/client-id"
          printf %s "$AUTH0_CLIENT_SECRET" >"$client_dir/client-secret"
          chmod 0600 "$client_dir/client-id" "$client_dir/client-secret"
          unset AUTH0_CLIENT_ID AUTH0_CLIENT_SECRET
          python3 orchestrator/scripts/qurl-cli-ci-credentials.py reconcile-run \
            --token-endpoint "$AUTH0_TOKEN_ENDPOINT" --audience "$QURL_ENDPOINT" \
            --qurl-endpoint "$QURL_ENDPOINT" --client-id-file "$client_dir/client-id" \
            --client-secret-file "$client_dir/client-secret" \
            --run-id "${SOURCE_RUN_ID}${{ matrix.lane_id }}" --run-attempt "$SOURCE_RUN_ATTEMPT" \
            --lane "${{ matrix.lane }}" --runtime host --cleanup-id-dir "$cleanup_id_dir"
          if [[ "$RUNNER_OS" == Linux ]]; then
            sudo loginctl disable-linger "$(id -un)" 2>/dev/null || true
          fi

      - name: Reconcile this Windows lane after the service fence
        if: always() && runner.os == 'Windows' && steps.fence-windows-service.outcome == 'success' && steps.remove-windows-key.outcome == 'success'
        shell: pwsh
        env:
          AUTH0_CLIENT_ID: ${{ secrets[matrix.auth0_client_id_secret] }}
          AUTH0_CLIENT_SECRET: ${{ secrets[matrix.auth0_client_secret_secret] }}
        run: |
          $clientDir = Join-Path $env:RUNNER_TEMP 'qurl-cli-ci-auth0'
          $cleanupIDDir = Join-Path $env:RUNNER_TEMP 'qurl-cli-ci-cleanup-ids'
          try {
            New-Item -ItemType Directory -Path $clientDir -ErrorAction Stop | Out-Null
            & icacls.exe $clientDir /inheritance:r /grant:r "${env:USERNAME}:(OI)(CI)(F)" '*S-1-5-18:(OI)(CI)(F)' '*S-1-5-32-544:(OI)(CI)(F)' | Out-Null
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $clientIDFile = Join-Path $clientDir 'client-id'
            $clientSecretFile = Join-Path $clientDir 'client-secret'
            [IO.File]::WriteAllText($clientIDFile, $env:AUTH0_CLIENT_ID)
            [IO.File]::WriteAllText($clientSecretFile, $env:AUTH0_CLIENT_SECRET)
            Remove-Item Env:AUTH0_CLIENT_ID, Env:AUTH0_CLIENT_SECRET -ErrorAction SilentlyContinue
            python orchestrator/scripts/qurl-cli-ci-credentials.py reconcile-run `
              --token-endpoint $env:AUTH0_TOKEN_ENDPOINT --audience $env:QURL_ENDPOINT `
              --qurl-endpoint $env:QURL_ENDPOINT --client-id-file $clientIDFile `
              --client-secret-file $clientSecretFile `
              --run-id "$($env:SOURCE_RUN_ID)${{ matrix.lane_id }}" --run-attempt $env:SOURCE_RUN_ATTEMPT `
              --lane '${{ matrix.lane }}' --runtime host --cleanup-id-dir $cleanupIDDir
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally {
            foreach ($path in @($clientDir, $cleanupIDDir)) {
              if (Test-Path -LiteralPath $path) { Remove-Item -LiteralPath $path -Recurse -Force }
              if (Test-Path -LiteralPath $path) { throw 'cleanup state remained on the customer runner' }
            }
          }

  cleanup:
    name: Reconcile disposable customer state
    needs: [resolve, journey]
    if: always() && needs.resolve.outputs.required == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Cleanup must never wait for a second manual approval after a journey
    # failure. This dedicated main-only controller can reconcile only the
    # exact run/attempt; lane-local minting does not use this environment.
    environment: cli-connector-resource-sandbox-controller
    permissions:
      contents: read
    env:
      QURL_ENDPOINT: ${{ secrets.QURL_SANDBOX_ENDPOINT }}
      AUTH0_TOKEN_ENDPOINT: ${{ vars.QURL_SANDBOX_AUTH0_TOKEN_ENDPOINT }}
      SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
      SOURCE_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Revoke run resources and credentials
        env:
          AUTH0_CLIENT_ID_LINUX: ${{ secrets.QURL_SANDBOX_AUTH0_CLIENT_ID_LINUX }}
          AUTH0_CLIENT_SECRET_LINUX: ${{ secrets.QURL_SANDBOX_AUTH0_CLIENT_SECRET_LINUX }}
          AUTH0_CLIENT_ID_MACOS: ${{ secrets.QURL_SANDBOX_AUTH0_CLIENT_ID_MACOS }}
          AUTH0_CLIENT_SECRET_MACOS: ${{ secrets.QURL_SANDBOX_AUTH0_CLIENT_SECRET_MACOS }}
          AUTH0_CLIENT_ID_WINDOWS: ${{ secrets.QURL_SANDBOX_AUTH0_CLIENT_ID_WINDOWS }}
          AUTH0_CLIENT_SECRET_WINDOWS: ${{ secrets.QURL_SANDBOX_AUTH0_CLIENT_SECRET_WINDOWS }}
        run: |
          set -euo pipefail
          client_dir=$RUNNER_TEMP/qurl-cli-ci-auth0
          mkdir -m 0700 "$client_dir"
          declare -A owner_lanes=()
          for lane in linux macos windows; do
            uppercase_lane=${lane^^}
            id_name=AUTH0_CLIENT_ID_$uppercase_lane
            secret_name=AUTH0_CLIENT_SECRET_$uppercase_lane
            printf %s "${!id_name}" >"$client_dir/$lane-id"
            printf %s "${!secret_name}" >"$client_dir/$lane-secret"
            chmod 0600 "$client_dir/$lane-id" "$client_dir/$lane-secret"
            unset "$id_name" "$secret_name"
            python3 scripts/qurl-cli-ci-credentials.py identify \
              --token-endpoint "$AUTH0_TOKEN_ENDPOINT" --audience "$QURL_ENDPOINT" \
              --qurl-endpoint "$QURL_ENDPOINT" --client-id-file "$client_dir/$lane-id" \
              --client-secret-file "$client_dir/$lane-secret" \
              --output-file "$client_dir/$lane-owner"
            owner_id=$(<"$client_dir/$lane-owner")
            [[ -z "${owner_lanes[$owner_id]:-}" ]] || {
              echo "::error::cleanup owners are not distinct" >&2
              exit 1
            }
            owner_lanes[$owner_id]=$lane
          done
          [[ ${#owner_lanes[@]} -eq 3 ]] || {
            echo "::error::cleanup owner verification is incomplete" >&2
            exit 1
          }
          for lane_spec in linux:1 macos:2 windows:3; do
            IFS=: read -r lane lane_id <<<"$lane_spec"
            python3 scripts/qurl-cli-ci-credentials.py reconcile-run \
              --token-endpoint "$AUTH0_TOKEN_ENDPOINT" --audience "$QURL_ENDPOINT" \
              --qurl-endpoint "$QURL_ENDPOINT" --client-id-file "$client_dir/$lane-id" \
              --client-secret-file "$client_dir/$lane-secret" \
              --run-id "${SOURCE_RUN_ID}${lane_id}" --run-attempt "$SOURCE_RUN_ATTEMPT" \
              --lane "$lane" --runtime host
          done

      - name: Remove standing authority from the cleanup runner
        if: always()
        run: scripts/remove-sensitive-tree.sh "$RUNNER_TEMP/qurl-cli-ci-auth0"

  result:
    name: Record exact customer-journey result
    needs: [resolve, journey, cleanup]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      checks: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          persist-credentials: false

      - id: record
        name: Record the exact source result
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          REQUIRED: ${{ needs.resolve.outputs.required }}
          RESOLVE_RESULT: ${{ needs.resolve.result }}
          JOURNEY_RESULT: ${{ needs.journey.result }}
          CLEANUP_RESULT: ${{ needs.cleanup.result }}
          SOURCE_RUN_URL: ${{ github.event.workflow_run.html_url }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
          SOURCE_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        run: |
          set -euo pipefail
          conclusion=failure
          summary="The trusted customer journey did not complete."
          if [[ "$RESOLVE_RESULT" == success && "$REQUIRED" == false ]]; then
            conclusion=success
            summary="No CLI-impacting change required the packaged customer journey."
          elif [[ "$RESOLVE_RESULT" == success && "$REQUIRED" == true && \
            "$JOURNEY_RESULT" == success && "$CLEANUP_RESULT" == success ]]; then
            conclusion=success
            summary="The exact packaged artifacts passed on Linux, macOS, and Windows."
          fi
          jq -cn \
            --arg name "qURL Customer Journey / exact CLI artifact" \
            --arg sha "$HEAD_SHA" --arg conclusion "$conclusion" \
            --arg external_id "layerv.qurl-cli-customer-journey.v1:${SOURCE_RUN_ID}:${SOURCE_RUN_ATTEMPT}:${HEAD_SHA}" \
            --arg title "Exact packaged CLI customer journey" \
            --arg summary "$summary" --arg details "$SOURCE_RUN_URL" \
            '{name:$name,head_sha:$sha,external_id:$external_id,status:"completed",conclusion:$conclusion,details_url:$details,output:{title:$title,summary:$summary}}' \
            >request.json
          gh api --method POST "repos/$GITHUB_REPOSITORY/check-runs" --input request.json >/dev/null
          echo "conclusion=$conclusion" >>"$GITHUB_OUTPUT"

      # release-please creates the draft release independently. If it already
      # exists for this exact SHA, this is the second event and starts the
      # continuation. Otherwise release-please will signal after it creates
      # the draft. No job waits for the other event.
      - name: Signal an exact CLI release that is ready to continue
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          version=$(jq -er '.["apps/cli"] | select(type == "string" and test("^[0-9]+\\.[0-9]+\\.[0-9]+([.-][0-9A-Za-z.-]+)?$"))' \
            .release-please-manifest.json)
          cli_tag="v${version}"
          tag_sha=$(git rev-parse --verify "${cli_tag}^{commit}" 2>/dev/null || true)
          if [[ "$tag_sha" != "$HEAD_SHA" ]]; then
            echo "No exact CLI release belongs to this source SHA."
            exit 0
          fi
          if ! release=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$cli_tag" 2>/dev/null); then
            echo "The exact CLI draft does not exist yet; its creator will signal the continuation."
            exit 0
          fi
          [[ $(jq -er '.draft | select(type == "boolean")' <<<"$release") == true ]] || {
            echo "The exact CLI release is already public."
            exit 0
          }
          gh workflow run release-please.yml --repo "$GITHUB_REPOSITORY" --ref main \
            --field "cli_tag=$cli_tag" --field "source_sha=$HEAD_SHA"

      - name: Require the customer journey to pass
        if: steps.record.outputs.conclusion != 'success'
        run: |
          echo "::error::The exact packaged CLI customer journey failed" >&2
          exit 1
