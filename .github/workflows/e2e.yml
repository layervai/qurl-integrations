name: "e2e: Build and Test"

# Path filtering lives in the `changes` job below, NOT in `on: paths:`.
# A workflow skipped by a path filter never reports its checks, so an
# `e2e / required` branch-protection rule would block every PR that
# doesn't touch e2e/. The detector + always-running aggregate keeps
# the check reporting on every PR — matching slack/discord/chrome-extension/shared.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Node version is read from e2e/.nvmrc below so CI and local dev (nvm) stay in
# lock-step. Avoid adding a NODE_VERSION env var or inline version — it would drift.
# That pin is 24.x, not the 22.21.0 the apps use: e2e/package.json asks for
# node >=24, and npm does not enforce engines by default, so nothing but this
# file makes the two agree.

jobs:
  changes:
    name: e2e / detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      # Reading this workflow's own run history is what lets the step below
      # find the last SHA it actually validated.
      actions: read
    outputs:
      # An unresolvable base forces every gate to run. A redundant run costs
      # minutes; a wrongly narrow diff ships unvalidated code green (#1022).
      e2e: ${{ steps.base.outputs.force == 'true' && 'true' || steps.filter.outputs.e2e }}
    steps:
      # On PRs, paths-filter uses the pull request API; push events need git
      # history to compute the diff.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'push'
        with:
          fetch-depth: 0

      # `cancel-in-progress: false` protects a run already in progress, not one
      # still pending: GitHub keeps at most one pending run per concurrency
      # group, so a burst of merges to main cancels the intermediate runs.
      # Diffing this push alone would then skip the gates for changes that
      # landed in those cancelled runs — every check green, app CI never having
      # executed (#1022). Diff against the last validated SHA instead.
      #
      # Until this workflow's first successful push run on main lands there is
      # no base to resolve, so it fails closed to a full run — the intended
      # behaviour, not a misconfiguration.
      - name: Resolve validated base
        id: base
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/resolve-validated-base.sh

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        # Skipped when no base could be resolved. The job output already forces
        # every gate true there, and running the filter anyway would let a
        # filter error redden this job instead of honouring the fail-closed
        # intent.
        if: steps.base.outputs.force != 'true'
        with:
          # Empty on pull_request, where the push-only step above never ran and
          # paths-filter takes its PR API path instead.
          base: ${{ steps.base.outputs.sha }}
          filters: |
            e2e:
              # Source of truth for e2e-impacting paths on PR and main push events.
              # No 'shared/**' or 'apps/**' here: this gate compiles and unit-tests
              # e2e/'s own TypeScript in isolation. The suite that actually exercises
              # the apps is the live one, which cannot run in CI (see below).
              - 'e2e/**'
              - '.github/workflows/e2e.yml'

  # Mirrored locally by `make check-e2e`, so a contributor can run this gate
  # before pushing. Adding or removing a step here means updating that target
  # too; it documents which steps it deliberately omits and why.
  build-and-test:
    name: e2e / build and test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: changes
    if: needs.changes.outputs.e2e == 'true'
    defaults:
      run:
        working-directory: e2e
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: e2e/.nvmrc
          cache: 'npm'
          cache-dependency-path: e2e/package-lock.json

      - name: Install dependencies
        run: npm ci

      # The wider of the two gates: tsconfig.json includes **/*.ts, so this
      # covers helpers/ and the live tests/ too, while the unit run below
      # executes only unit/**. For the live suite this is the only gate there
      # is. -p is explicit rather than relying on tsc's upward search, and
      # names the same config ts-jest compiles with (neither jest config
      # overrides it).
      - name: Typecheck
        run: npx tsc -p tsconfig.json --noEmit

      # Deliberately `test:unit`, never `npm test` — that script chains the
      # live suite, which mints real qURL resources and posts real Discord
      # messages against credentials in e2e/.env (see e2e/README.md). Those
      # credentials are not in CI and must not be: promoting this step to
      # `npm test` would turn every PR into live-API traffic.
      #
      # Only jest.unit.config.ts is safe here. jest.config.ts loads
      # setupFiles: ['dotenv/config']; the unit config does not, and
      # unit/**'s tests touch no process.env, so this needs no .env.
      - name: Run unit tests
        run: npm run test:unit

  required:
    name: e2e / required
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    # Every e2e quality gate must be listed here; e2e / required only
    # validates jobs in this needs set. display_names below is annotation-only.
    needs: [changes, build-and-test]
    if: always()
    steps:
      - name: Verify e2e CI result
        shell: bash
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          E2E_CHANGED: ${{ needs.changes.outputs.e2e }}
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          if [ "$CHANGES_RESULT" != "success" ]; then
            echo "::error::e2e / detect changes concluded $CHANGES_RESULT"
            exit 1
          fi

          case "$E2E_CHANGED" in
            true)
              ;;
            false)
              echo "No e2e-impacting changes detected; e2e CI is not required."
              exit 0
              ;;
            *)
              echo "::error::e2e / detect changes emitted unexpected e2e output: ${E2E_CHANGED:-<empty>}"
              exit 1
              ;;
          esac

          display_name() {
            case "$1" in
              build-and-test)
                echo "e2e / build and test"
                ;;
              *)
                echo "$1"
                ;;
            esac
          }

          failed=0
          needs_rows="$(jq -r 'to_entries[] | [.key, (.value.result // "")] | @tsv' <<<"$NEEDS_JSON")"
          while IFS=$'\t' read -r job result; do
            [ -n "$job" ] || continue
            if [ "$job" = "changes" ]; then
              # The change detector is checked above; it is not an e2e quality gate.
              continue
            fi
            if [ "$result" != "success" ]; then
              # e2e-impacting changes require every quality gate listed in
              # needs to run and pass; skipped/cancelled is a failed gate.
              echo "::error::$(display_name "$job") concluded ${result:-<empty>}"
              failed=1
            fi
          done <<<"$needs_rows"

          exit "$failed"
