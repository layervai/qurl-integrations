# Lint and test the repo's shell scripts and release configuration.
# Cheap and unfiltered so the installer's tag-selection policy and the
# release-please config/manifest pairing can never drift without a PR check
# noticing (both previously merged with zero mechanical verification).
name: Scripts

on:
  pull_request:
  merge_group:
  workflow_dispatch:

concurrency:
  group: scripts-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  scripts:
    name: Lint and test scripts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: shellcheck
        run: shellcheck scripts/*.sh

      - name: Test install.sh
        run: scripts/test-install.sh

      - name: Check release-please config/manifest sync
        run: scripts/check-release-please-sync.sh

      # Authoritative here and nowhere else: this runner's jq is 1.7, and
      # jq 1.8 (typical locally) accepts the parse error this catches.
      - name: Check main CI notification payload builds
        run: scripts/check-main-ci-notification-payload.sh
