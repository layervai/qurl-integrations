# Lint and test the repo's shell scripts, release configuration, and
# cross-app copies that have to stay identical.
# Cheap and unfiltered so the installer's tag-selection policy, the
# release-please config/manifest pairing, and the Chrome/Edge extension
# lockstep can never drift without a PR check noticing (each previously
# relied on reviewers catching it by hand).
name: Scripts

on:
  pull_request:
  merge_group:
  workflow_dispatch:

concurrency:
  group: scripts-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  scripts:
    name: Lint and test scripts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: shellcheck
        run: shellcheck scripts/*.sh

      - name: Test install.sh
        run: scripts/test-install.sh

      - name: Check release-please config/manifest sync
        run: scripts/check-release-please-sync.sh

      - name: Check Chrome/Edge extension lockstep
        run: scripts/check-extension-lockstep.sh
