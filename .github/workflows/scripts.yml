# Lint and test the repo's shell scripts, release configuration, and
# cross-app copies that have to stay identical.
# Cheap and unfiltered so the installer's tag-selection policy, the
# release-please config/manifest pairing, and the Chrome/Edge extension
# lockstep can never drift without a PR check noticing (each previously
# relied on reviewers catching it by hand).
name: Scripts

on:
  pull_request:
  merge_group:
  workflow_dispatch:

concurrency:
  group: scripts-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

# This job executes shell from the PR under review, including the run
# block that check-main-ci-notification-payload.sh extracts. That is safe
# only because the job stays secret-free on a read-only `pull_request`
# token — adding secrets or write permissions here would turn it into an
# exfiltration path. Keep it that way.

# Every check below is independent, so each one is guarded to run even after
# an earlier failure. Without that the first red check hides the rest, and a
# check that stops running looks exactly like a check that passes.
#
# One consequence: timeout-minutes below is now a whole-suite budget rather
# than "until the first failure". The suite runs in about 8s against the 5m
# cap, so there is room, but a slow new check spends everyone's margin.
jobs:
  scripts:
    name: Lint and test scripts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: shellcheck
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: shellcheck scripts/*.sh

      - name: Test install.sh
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: scripts/test-install.sh

      - name: Check release-please config/manifest sync
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: scripts/check-release-please-sync.sh

      # Its three invariants are the only pre-merge check on release-please's
      # config, and each passes by accident while the repo is already correct,
      # so an assertion that stopped biting would be silent.
      - name: Test release-please sync check
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: scripts/test-check-release-please-sync.sh

      # The verifier it exercises only ever runs on a push to main, after a
      # CLI release has already been made or dropped, so a defect in it ships
      # green and surfaces exactly when it is needed. Same reason as the
      # Claude review budget report below.
      - name: Test CLI release verifier
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: scripts/test-verify-cli-release.sh

      - name: Check Chrome/Edge extension lockstep
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: scripts/check-extension-lockstep.sh

      # The message catalogs are excluded from the lockstep check above
      # (sanctioned wording deltas), so this is the only thing comparing
      # them. Its own failure paths are exercised by the test below.
      - name: Check Chrome/Edge i18n parity
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: scripts/check-i18n-parity.sh

      - name: Test i18n parity checker
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: scripts/test-check-i18n-parity.sh

      # The jq <= 1.7 parse check is only meaningful on a runner whose jq
      # still has the restricted grammar; jq 1.8 (typical locally, and
      # eventually here) accepts the form it rejects. The script reports
      # which half it actually enforced.
      - name: Check main CI notification payload builds
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: scripts/check-main-ci-notification-payload.sh

      # The resolver decides whether app CI runs at all on main, and its
      # failure mode is silence rather than a red run, so every branch of it
      # is exercised here against a fixture repo and a stub `gh`.
      - name: Test validated-base resolver
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: scripts/test-resolve-validated-base.sh

      # The report step only runs once the Claude review has already failed, so
      # a defect in it ships green and surfaces exactly when it is needed. This
      # pins that every branch still annotates — a bare echo there would restore
      # the silent pass the step exists to remove.
      - name: Test Claude review budget report
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: scripts/test-claude-review-budget-report.sh
