version: "2"

run:
  timeout: 5m

output:
  sort-order:
    - linter
    - severity
    - file

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/layervai/qurl-integrations

linters:
  default: none
  enable:
    # Bugs & Error Handling
    - bodyclose        # HTTP response body must be closed
    - errcheck         # Check error returns are handled
    - errorlint        # Error wrapping issues (errors.Is/As)
    - govet            # Reports suspicious constructs
    - nilerr           # Returns nil when err is not nil
    - nilnil           # Returns nil error with nil value
    - noctx            # HTTP requests without context
    - staticcheck      # Advanced static analysis
    - unused           # Find unused code

    # Complexity
    - gocognit         # Cognitive complexity
    - gocyclo          # Cyclomatic complexity

    # Style & Consistency
    - dogsled          # Too many blank identifiers
    - dupl             # Code duplication detection
    - exhaustive       # Exhaustive switch statements
    - goconst          # Repeated strings that should be constants
    - gocritic         # Opinionated style checks
    - goprintffuncname # Printf-like function naming
    - misspell         # Spelling mistakes
    - nakedret         # Naked returns in long functions
    - nolintlint       # Ill-formed nolint directives
    - prealloc         # Slice preallocation suggestions
    - revive           # Fast, extensible linter
    - unconvert        # Unnecessary type conversions
    - whitespace       # Unnecessary whitespace

    # Performance
    - copyloopvar      # Loop variable copy issues
    - perfsprint       # Performance-aware sprintf

    # Security
    - gosec            # Security issues

    # Testing
    - tparallel        # Improper t.Parallel() usage

  settings:
    gocognit:
      min-complexity: 30
    gocyclo:
      min-complexity: 20
    dupl:
      threshold: 150
    goconst:
      min-len: 3
      min-occurrences: 3
      # goconst v1.10.0 (golangci-lint v2.12.x) started scanning composite
      # literals, so every string in a table-driven test's rows now counts.
      # That is roughly 500 findings anchored in _test.go plus inflated counts for
      # production strings -- `list` reads as "23 occurrences" when 22 of them
      # are test-table rows. A path exclusion cannot fix the second half: it
      # drops the test-anchored issue but goconst still counts the test file's
      # occurrences. Skipping test files at parse time is the only knob that
      # does both. (Hard-coded false before v2.12.0; a real setting since.)
      ignore-tests: true
    gocritic:
      enabled-tags:
        - diagnostic
        - experimental
        - opinionated
        - performance
        - style
    misspell:
      locale: US
    nakedret:
      max-func-lines: 30
    nolintlint:
      require-explanation: true
      require-specific: true
    perfsprint:
      sprintf1: true
      errorf: true
      int-conversion: true
    gosec:
      excludes:
        - G101  # Hardcoded credentials (false positives on variable names)
        - G115  # Integer overflow on conversion (safe: all values are bounded)
        - G117  # Exported field matches secret pattern (false positives on JSON field names)
        - G703  # Unvalidated errors.As target (false positive: our APIError type is safe)
        - G704  # SSRF via taint analysis (API client takes user-provided URLs by design)
      # G705/G706 are NOT excluded and still run. Worth knowing what changed
      # under gosec v2.26.1 (golangci-lint v2.12.x): with every suppression in
      # this repo stripped, v2.10.1's gosec reported 59 taint findings (56 G706,
      # 3 G705) and v2.12.2's reports 0. That is the false-positive class going
      # away, not the check: G706 now inspects only a slog call's msg argument
      # (attribute values are escaped by both stdlib handlers) and G705 only
      # fires when the writer is a net/http.ResponseWriter. A genuinely tainted
      # msg, or tainted data written to a ResponseWriter, still trips them --
      # which is why the 48 //nolint:gosec directives this repo carried could be
      # deleted rather than converted into exclusions.
    revive:
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: context-keys-type
        - name: dot-imports
        - name: empty-block
        - name: error-naming
        - name: error-return
        - name: error-strings
        - name: errorf
        - name: exported
          arguments:
            - checkPrivateReceivers
        - name: increment-decrement
        - name: indent-error-flow
        - name: package-comments
        - name: range
        - name: receiver-naming
        - name: redefines-builtin-id
        - name: superfluous-else
        - name: time-naming
        - name: var-naming

  exclusions:
    generated: lax
    paths:
      - (^|/)node_modules/
    rules:
      # Relax complexity checks in tests
      - linters:
          - gocognit
          - gocyclo
          - dupl
        path: _test\.go
      # noctx v0.5.x added this check (v2.12.2 pins v0.5.1; it first shipped in
      # golangci-lint v2.11.4, so it is new relative to this repo's v2.10.1 pin,
      # not new in v2.12). It exists to keep context propagating
      # into real outbound requests; httptest.NewRequest builds a server-side
      # fixture that is never sent, so the check's own rationale does not apply.
      # Narrower than "the context is unused": handlers under test do read
      # r.Context() (oauth.Callback and oauth.Start derive from it), so
      # NewRequestWithContext(t.Context(), ...) would buy real test-scoped
      # cancellation in ~15 of the 40 sites. That is a refactor worth doing on
      # its own merits, not a reason to hold the linter bump. Pinned to the one
      # check by text so noctx's genuine findings (uncontextualized http.Get and
      # friends) still apply in tests.
      #
      # TODO(upstream-contract): the text below mirrors noctx's own message
      # string, which we do not control. If upstream rewords it the exclusion
      # stops matching and every httptest.NewRequest in the repo fails the
      # check again -- loudly, on the next lint run, not silently.
      - linters:
          - noctx
        path: _test\.go
        text: "httptest.NewRequest must not be called"
