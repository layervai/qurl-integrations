worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    # JSON access log to stdout. `status` is numeric for the CloudWatch
    # metric filter ($.layer = "nginx" && $.status >= 500). `layer` separates
    # nginx lines from Envoy lines in the shared origin log stream.
    # `upstream_status` (quoted: may be empty on a cache hit) distinguishes an
    # S3 403 (signing/auth failure) from an on-path 404 (missing key).
    log_format json_access escape=json
        '{'
        '"layer":"nginx",'
        '"method":"$request_method",'
        '"path":"$uri",'
        '"key":"$s3_target",'
        '"status":$status,'
        '"upstream_status":"$upstream_status",'
        '"cache":"$upstream_cache_status",'
        '"bytes":$body_bytes_sent,'
        '"duration_s":$request_time'
        '}';
    access_log /dev/stdout json_access;

    # Writable paths for the unprivileged (uid 65532) runtime user. nginx
    # eagerly creates every temp dir at startup, so all must point at /tmp
    # (the compiled-in defaults under /var/cache/nginx are not writable).
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    proxy_cache_path /tmp/s3cache levels=1:2 keys_zone=s3cache:10m
                     max_size=1g inactive=24h use_temp_path=off;
    # Cache key excludes the query string, so `?_t=` cache-busters collapse to a
    # single entry — matching CloudFront's CACHING_OPTIMIZED query-excluded key.
    # $request_method keeps GET and HEAD entries distinct.
    # Keep this in sync with cachectl.sh's CACHE_KEY_* defaults; targeted purge
    # reconstructs nginx's on-disk cache key from those values.
    proxy_cache_key "$request_method$scheme$proxy_host$uri";

    # Clean-URL rewrite — the CloudFront viewer-request function, rule for rule:
    #   uri ends with '/'        -> append INDEX_DOCUMENT
    #   uri has no '.' anywhere  -> append '/' + INDEX_DOCUMENT   (dot suppresses)
    # The trailing-slash rule is listed first so it wins, as CloudFront checks
    # endsWith('/') before includes('.'). Evaluated on $uri only; the query
    # string never participates. nginx applies its own safe URI normalization
    # (merge_slashes, dot-segment removal) first — a strict superset of
    # CloudFront for the static paths served here.
    map $uri $clean_suffix {
        default        "";
        "~/$"          "index.html";
        "~^[^.]+$"     "/index.html";
    }

    upstream envoy_upstream {
        server 127.0.0.1:9090;
        keepalive 16;
    }

    server {
        listen 127.0.0.1:8080;
        server_name _;
        server_tokens off;

        gzip on;
        gzip_vary on;
        gzip_proxied any;
        gzip_types text/plain text/css application/json application/javascript text/javascript text/xml application/xml image/svg+xml;

        # Security headers — byte-for-byte the CloudFront ResponseHeadersPolicy
        # this origin replaces. Set at server scope (no child context adds its
        # own header, so these are inherited everywhere) with `always` so they
        # apply to 404/405/5xx responses too.
        # nginx drops inherited add_header values if a child location defines
        # any add_header; behavior_test.sh asserts this set across statuses.
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet, noimageindex" always;

        location / {
            if ($request_method !~ "^(GET|HEAD)$") { return 405 "Method Not Allowed\n"; }

            # $uri is percent-decoded, and proxy_pass with a variable target
            # forwards it to Envoy WITHOUT re-encoding. Reject any decoded
            # control byte (CR/LF/NUL/tab/DEL) so a viewer path such as
            # `/x%0d%0a...GET%20/other-key` cannot splice a second, prefix-
            # escaping request into the signer hop. Remapped to a clean 404 by
            # the error_page below. behavior_test.sh locks this against upstream.
            if ($uri ~ "[\x00-\x1f\x7f]") { return 400; }

            # Final S3 key path: optional prefix + clean-URL-resolved path.
            set $s3_target "${uri}${clean_suffix}";

            # Forward to the in-container Envoy SigV4 signer. The variable-URI
            # form sends exactly $s3_target and does NOT append the client query
            # string, so `?_t=` cache-busters never reach the signed request.
            # Signing happens AFTER this rewrite, so the path Envoy signs is the
            # path S3 receives (avoids the SignatureDoesNotMatch class).
            proxy_pass http://envoy_upstream$s3_target;
            # Viewer headers are not part of the static-origin contract. Forward
            # only the explicit headers below so stray x-amz-* headers never
            # reach the SigV4 signer.
            proxy_pass_request_headers off;
            # Host the signer signs and S3 sees — must equal the cluster SNI.
            proxy_set_header Host example-bucket.s3.us-east-1.amazonaws.com;
            proxy_set_header Authorization "";
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_next_upstream off;

            proxy_cache s3cache;
            # Serve byte ranges for cached/proxied objects even when S3's
            # response omits Accept-Ranges.
            proxy_force_ranges on;
            # By default nginx caches successful object responses per the
            # object's Cache-Control/Expires; CACHE_DEFAULT_TTL (if set) renders
            # a fallback proxy_cache_valid here.
            # CACHE_DEFAULT_TTL unset; no fallback proxy_cache_valid emitted.
            proxy_cache_revalidate on;
            proxy_cache_lock on;
            proxy_cache_lock_timeout 30s;
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
            proxy_cache_background_update on;
            # Honor object Cache-Control/Expires for TTL; ignore Set-Cookie/Vary.
            proxy_ignore_headers Set-Cookie Vary;

            # Envoy strips the complete x-amz-* response namespace before this
            # cache boundary. Strip Envoy's timing header here too; neither is
            # part of the static-origin contract, and together they fingerprint
            # the viewer's site as S3 behind an Envoy signer.
            proxy_hide_header x-envoy-upstream-service-time;

            # Never leak S3 responses — bodies, headers, or the 403/404
            # distinction — to clients. Clients see a clean 404 (missing,
            # denied, or malformed S3-side request) or 502 (upstream down); the
            # access log still records $upstream_status for alarming.
            #
            # The lists are exhaustive on purpose, so a status S3 starts
            # returning later is masked by default rather than passed through.
            # Listing only the expected statuses is what leaked S3's 301
            # PermanentRedirect — body naming the private bucket and its true
            # region — to viewers whenever an admin mistyped the region.
            # Every omission is a response nginx generates itself, never one
            # derived from upstream: 304 (conditional/revalidation; no body, and
            # proxy_cache_revalidate needs it), 416 (the viewer's Range never
            # reaches S3, so only nginx's range filter can raise it), and 499
            # (rejected by error_page). Upstream 405 is deliberately listed;
            # the local 405 method guard above returns its own body without
            # consulting error_page.
            proxy_intercept_errors on;
            error_page
                300 301 302 303 305 306 307 308 309 310 311 312 313 314 315
                316 317 318 319 320 321 322 323 324 325 326 327 328 329 330
                331 332 333 334 335 336 337 338 339 340 341 342 343 344 345
                346 347 348 349 350 351 352 353 354 355 356 357 358 359 360
                361 362 363 364 365 366 367 368 369 370 371 372 373 374 375
                376 377 378 379 380 381 382 383 384 385 386 387 388 389 390
                391 392 393 394 395 396 397 398 399 400 401 402 403 404 405
                406 407 408 409 410 411 412 413 414 415 417 418 419 420 421
                422 423 424 425 426 427 428 430 431 432 433 434 435 436 437
                438 439 440 441 442 443 444 445 446 447 448 449 450 451 452
                453 454 455 456 457 458 459 460 461 462 463 464 465 466 467
                468 469 470 471 472 473 474 475 476 477 478 479 480 481 482
                483 484 485 486 487 488 489 490 491 492 493 494 495 496 497
                498
                = @notfound;
            error_page
                429 500 501 502 503 504 505 506 507 508 509 510 511 512 513
                514 515 516 517 518 519 520 521 522 523 524 525 526 527 528
                529 530 531 532 533 534 535 536 537 538 539 540 541 542 543
                544 545 546 547 548 549 550 551 552 553 554 555 556 557 558
                559 560 561 562 563 564 565 566 567 568 569 570 571 572 573
                574 575 576 577 578 579 580 581 582 583 584 585 586 587 588
                589 590 591 592 593 594 595 596 597 598 599
                = @upstream_error;
        }

        location @notfound {
            default_type text/plain;
            return 404 "Not Found\n";
        }

        location @upstream_error {
            default_type text/plain;
            return 502 "Bad Gateway\n";
        }
    }
}
