# Envoy SigV4 signing layer — internal to the s3-static-connector image.
# Bound to loopback only. Receives cache-miss requests from nginx, signs the
# final hop to private S3 with the workload's AWS credentials (default provider
# chain: EC2 instance role via IMDSv2, ECS task role, env), and forwards to S3.
# render.sh appends the TLS transport_socket (envoy.tls.partial) when talking to
# real S3; the behavior tests render without it and point at a plaintext stub.
node:
  id: s3-static-connector
  cluster: s3-static-connector

static_resources:
  listeners:
  - name: origin
    address:
      socket_address: { address: "127.0.0.1", port_value: 9090 }
    filter_chains:
    - filters:
      - name: envoy.filters.network.http_connection_manager
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
          stat_prefix: s3_origin
          codec_type: AUTO
          # A credential that expires or loses access after startup makes S3
          # reject every signed request, and nginx masks that to a viewer 404 by
          # design — so the only operator-side trace is an `upstream_status`
          # field on an otherwise ordinary-looking 404 access line. Emit one
          # explicit request-rejected line instead. Status alone cannot assign
          # the cause to credentials rather than IAM, region, endpoint, or other
          # request configuration. Filtered to the rejection statuses only:
          # normal traffic (including real 404s) logs nothing here, and the
          # viewer-facing response is unchanged.
          access_log:
          - name: envoy.access_loggers.stdout
            filter:
              or_filter:
                filters:
                # 400 and 403 cover multiple S3 error codes, so do not label
                # either status as an authentication verdict.
                - status_code_filter:
                    comparison:
                      op: EQ
                      value: { default_value: 400, runtime_key: s3_request_rejected_400 }
                - status_code_filter:
                    comparison:
                      op: EQ
                      value: { default_value: 403, runtime_key: s3_request_rejected_403 }
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog
              log_format:
                json_format:
                  layer: origin
                  msg: s3_request_rejected
                  status: "%RESPONSE_CODE%"
                  key: "%REQ(:PATH)%"
          route_config:
            name: s3_routes
            virtual_hosts:
            - name: s3
              domains: ["*"]
              routes:
              - match: { prefix: "/" }
                route:
                  cluster: s3
                  timeout: 30s
          http_filters:
          - name: envoy.filters.http.aws_request_signing
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.aws_request_signing.v3.AwsRequestSigning
              service_name: s3
              region: us-west-2
              # GET/HEAD carry no body — sign with x-amz-content-sha256:
              # UNSIGNED-PAYLOAD instead of buffering to hash an empty body.
              use_unsigned_payload: true
              # Sign the bucket vhost; nginx already set this Host and the cluster
              # SNI matches, so signed Host == sent Host == SNI.
              host_rewrite: "example-bucket.s3.us-west-2.amazonaws.com"
              # Never sign hop-by-hop / proxy-injected headers — S3 would
              # recompute a different signature.
              match_excluded_headers:
              - prefix: x-forwarded
              - prefix: x-envoy
              - exact: x-amzn-trace-id
              - exact: x-request-id
          - name: envoy.filters.http.router
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
  clusters:
  - name: s3
    type: LOGICAL_DNS
    connect_timeout: 5s
    # Standard AWS commercial S3 egress is the supported path; IPv6-only S3
    # egress stays out of scope for this image.
    dns_lookup_family: V4_ONLY
    load_assignment:
      cluster_name: s3
      endpoints:
      - lb_endpoints:
        - endpoint:
            address:
              socket_address: { address: "example-bucket.s3.us-west-2.amazonaws.com", port_value: 443 }
    transport_socket:
      name: envoy.transport_sockets.tls
      typed_config:
        "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.UpstreamTlsContext
        sni: example-bucket.s3.us-west-2.amazonaws.com
        common_tls_context:
          validation_context:
            trusted_ca:
              filename: /etc/ssl/certs/ca-certificates.crt
            match_typed_subject_alt_names:
            - san_type: DNS
              matcher:
                exact: example-bucket.s3.us-west-2.amazonaws.com
